[Interface]
Address = ${INTERFACE}.1
ListenPort = 51820
PrivateKey = $(cat /config/server/privatekey-server)
# VPN clients may only reach the vault web UI (10.213.77.10:80); no LAN, no internet, no client-to-client.
PostUp = iptables -A FORWARD -i %i -d 10.213.77.10 -p tcp --dport 80 -j ACCEPT; iptables -A FORWARD -o %i -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT; iptables -A FORWARD -i %i -j DROP; iptables -A FORWARD -o %i -j DROP; iptables -t nat -A POSTROUTING -o eth+ -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -d 10.213.77.10 -p tcp --dport 80 -j ACCEPT; iptables -D FORWARD -o %i -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT; iptables -D FORWARD -i %i -j DROP; iptables -D FORWARD -o %i -j DROP; iptables -t nat -D POSTROUTING -o eth+ -j MASQUERADE
