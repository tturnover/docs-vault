# nginx in front of dufs (same container, dufs listens on 127.0.0.1:5000).
#
# Access model:
#   - No "docs_auth" cookie  -> anonymous, read-only. Any Authorization header the browser
#                               still has cached is stripped, so dufs sees an anonymous reader.
#   - Cookie docs_auth=1     -> "writer mode": credentials are passed to dufs; if the browser
#                               sent none, answer 401 so it asks for a login.
#   The UI sets the cookie on "Увійти" and clears it on "Вийти".
#   Every 401 gets a Basic-only challenge and a page explaining how to retry.
#
# Folder access (hidden / password) is enforced by vault.js (njs, loaded in nginx.conf).

map "$cookie_docs_auth:$http_authorization" $docs_force_login {
    "~^1:$"  1;      # writer mode requested, no credentials sent yet
    default  0;
}

# Hidden / password-protected folders: see vault.js
js_engine qjs;                  # QuickJS: modern JavaScript (for…of etc.)
js_path /etc/nginx/vault;
js_import vault from vault.js;
js_set $vault_action vault.action;

# readers get a fixed browser user agent upstream: dufs answers other agents (curl, wget…)
# with a plain listing that would bypass the vault filter
map $docs_auth_pass $vault_ua {
    ""       "Mozilla/5.0 (vault reader)";
    default  $http_user_agent;
}

limit_req_zone $binary_remote_addr zone=vault_unlock:1m rate=10r/m;

map $cookie_docs_auth $docs_auth_pass {
    "1"      $http_authorization;
    default  "";     # empty value => header not sent upstream
}

server {
    listen 80;
    listen [::]:80;

    client_max_body_size 0;          # no upload size limit (dufs handles it)
    absolute_redirect off;           # relative Location: works behind Caddy (https) and on the LAN port

    set $dufs http://127.0.0.1:5000;

    error_page 401 /__login401.html;
    error_page 404 /__notfound.html;   # missing file/folder → page that redirects to the nearest existing folder

    # client address for the unlock rate limit: trusted reverse proxies (VAULT_TRUSTED_PROXIES),
    # written by entrypoint.sh; empty = use the direct peer address
    include /etc/nginx/vault/realip.conf;

    # upstream settings shared by every proxied location below
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $docs_auth_pass;
    proxy_set_header User-Agent $vault_ua;
    proxy_hide_header WWW-Authenticate;
    proxy_request_buffering off;   # stream uploads (progress bar stays accurate)
    proxy_buffering off;           # stream video / downloads
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_intercept_errors on;     # only codes listed in error_page are intercepted (401, 404)

    location / {
        if ($docs_force_login) { return 401; }

        set $vault_uri $uri;
        set $va $vault_action;
        if ($va = "")     { return 503; }   # vault.js failed → refuse rather than serve unfiltered
        if ($va = 404)    { return 404; }
        if ($va = 403)    { return 403; }
        if ($va = Z)      { rewrite ^ /__vault/zipdeny last; }
        if ($va ~ ^L)     { rewrite ^ /__vault/locked last; }
        if ($va = json)   { rewrite ^ /__vault/json last; }

        proxy_pass $dufs;
    }

    # listings / search results, filtered and annotated by vault.js
    location = /__vault/json {
        internal;
        proxy_pass $dufs$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $docs_auth_pass;
        proxy_set_header User-Agent $vault_ua;
        proxy_set_header Accept-Encoding "";
        js_header_filter vault.jsonHeaders;
        js_body_filter vault.jsonBody buffer_type=buffer;   # raw bytes: chunks may split UTF-8 characters
    }

    location = /__vault/locked {
        internal;
        js_content vault.locked;
    }

    # the app page itself (contains no folder data), for links into a locked folder
    location = /__vault/spa {
        internal;
        proxy_pass $dufs/;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_set_header User-Agent "Mozilla/5.0 (vault reader)";
        proxy_set_header Accept-Encoding "";
    }

    location = /__vault/zipdeny {
        internal;
        default_type "text/plain; charset=utf-8";
        return 403 "Архів цієї папки недоступний: в ній є захищений вміст.\n";
    }

    location = /__vault/unlock {
        limit_req zone=vault_unlock burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        client_body_buffer_size 8k;
        js_content vault.unlock;
    }

    location = /__vault/lock {
        js_content vault.lockAll;
    }

    location = /__notfound.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location = /__login401.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header WWW-Authenticate 'Basic realm="docs", charset="UTF-8"' always;
    }
}
