      { t: 'Зображення', show: '![Опис фото](фото.jpg)', out: 'Покаже зображення «фото.jpg» з цієї ж папки.' },
      { t: 'Цитата / примітка', show: '> **Увага!** Перевірте полярність.', block: true },
      { t: 'Таблиця', show: '| Деталь | К-сть |\n|:-------|------:|\n| Гвинт  |     4 |\n| Гайка  |     4 |', block: true,
        note: ':--- — по лівому краю, ---: — по правому, :---: — по центру' },
      { t: 'Розділювач', show: '---', block: true },
      { t: 'Новий рядок без нового абзацу', show: 'перший рядок··\nдругий рядок', ins: 'перший рядок  \nдругий рядок',
        note: '·· — два пробіли в кінці рядка. Порожній рядок між текстом — новий абзац.' }
    ];

    function openMdHelp(ta) {
      const back = el('div', { class: 'modal-back' });
      const close = () => { document.removeEventListener('keydown', onKey, true); back.remove(); ta.focus(); };
      const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
      const insert = text => {
        const start = ta.selectionStart, before = ta.value.slice(0, start);
        const lead = before && !before.endsWith('\n') ? '\n' : '';
        ta.setRangeText(lead + text, start, ta.selectionEnd, 'end');
        ta.dispatchEvent(new Event('input'));
        close();
      };
      const rows = MD_CHEATS.map(c => {
        const ins = (c.ins || c.show) + (c.block ? '\n' : '');
        const out = el('div', { class: 'cs-out md' });
        if (c.out) out.textContent = c.out; else out.innerHTML = md(c.ins || c.show);   // render what actually gets inserted
        return el('div', { class: 'cs-row' },
          el('div', { class: 'cs-title', text: c.t }),
          el('div', { class: 'cs-pair' },
            el('button', { class: 'cs-src', type: 'button', title: 'Вставити в текст', onclick: () => insert(ins) }, el('pre', { text: c.show })),
            out),
          c.note ? el('div', { class: 'cs-note', text: c.note }) : null);
      });
      const box = el('div', { class: 'modal cheat', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'cs-h' },
        el('div', { class: 'cs-head' },
          el('h2', { id: 'cs-h', text: 'Шпаргалка з Markdown' }),
          button('close', 'Закрити', 'btn-ghost', close, { iconOnly: true })),
        el('p', { text: 'Ліворуч — що пишете, праворуч — що отримаєте. Натисніть приклад, щоб вставити його в текст.' }),
        el('div', { class: 'cs-list' }, ...rows));
      back.append(box);
      back.addEventListener('click', e => { if (e.target === back) close(); });
      document.addEventListener('keydown', onKey, true);
      document.body.append(back);
      box.querySelector('.cs-src').focus();
    }

    const editorDirty = () => !!(S.editor && S.editor.ta.value !== S.editor.original);

    async function saveEditor() {
      const ed = S.editor;
      if (!ed || ed.saving) return;
      ed.saving = true;
      try {
        // conflict check: was the file changed by someone else since we opened it?
        const head = await fetch(pathOf(ed.segs), { method: 'HEAD', cache: 'no-store' }).catch(() => null);
        const curTag = head && head.ok ? head.headers.get('etag') : null;
        if (ed.etag && curTag && curTag !== ed.etag &&
            !confirm('Файл було змінено кимось іншим після відкриття. Перезаписати їхні зміни?')) return;
        const text = ed.ta.value;
        const res = await fetch(pathOf(ed.segs), { method: 'PUT', body: new Blob([text], { type: 'text/plain;charset=utf-8' }) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        ed.original = text;
        const after = await fetch(pathOf(ed.segs), { method: 'HEAD', cache: 'no-store' }).catch(() => null);
        ed.etag = after && after.ok ? after.headers.get('etag') : null;
        ed.ta.dispatchEvent(new Event('input'));
        toast('Збережено');
      } catch (e) {
        alert('Не вдалося зберегти: ' + e.message);
      } finally {
        ed.saving = false;
      }
    }

    function closeEditor() {
      navigate(viewHref(fileCtx.segs));
    }

    /* ---------- uploads ---------- */
    const uploads = [];
    let uploadSeq = 0;
    let paintTimer = null;

    /* ---------- overwrite check ---------- */
    // Ask before an upload replaces files that already exist in the target folder(s).
    async function uploadItems(items, segs) {
      if (!S.canWrite) return;
      const norm = items.map(it => it instanceof File ? { file: it, rel: [] } : it);
      const files = norm.filter(it => !it.dir);
      // group by destination folder, fetch its listing once
      const groups = new Map();
      for (const it of files) {
        const key = it.rel.join('/');
        if (!groups.has(key)) groups.set(key, { rel: it.rel, items: [] });
        groups.get(key).items.push(it);
      }
      const conflicts = [];
      for (const g of groups.values()) {
        g.names = await listNames(segs.concat(g.rel));
        for (const it of g.items) if (g.names.has(it.file.name)) conflicts.push(it);
      }
      if (conflicts.length) {
        const choice = await askOverwrite(conflicts, segs);
        if (!choice) return;
        if (choice === 'skip') {
          const skip = new Set(conflicts);
          const rest = norm.filter(it => !skip.has(it));
          if (!rest.length) { toast('Нічого не завантажено — всі файли вже є'); return; }
          return enqueue(rest, segs);
        }
        if (choice === 'rename') {
          for (const g of groups.values()) {
            const taken = new Set(g.names);
            g.items.forEach(it => { if (!g.names.has(it.file.name)) taken.add(it.file.name); });
            for (const it of g.items) {
              if (!g.names.has(it.file.name)) continue;
              it.name = freeName(it.file.name, taken);
              taken.add(it.name);
            }
          }
        }
        // 'replace' → upload as is (PUT overwrites)
      }
      enqueue(norm, segs);
    }

    async function listNames(segs) {
      try {
        const d = await getJson(dirHref(segs) + '?json');
        return new Set((d.paths || []).map(p => p.name));
      } catch (_) {
        return new Set();   // folder does not exist yet → nothing to overwrite
      }
    }

    function freeName(name, taken) {
      const dot = name.lastIndexOf('.');
      const base = dot > 0 ? name.slice(0, dot) : name;
      const ext = dot > 0 ? name.slice(dot) : '';
      for (let n = 1; ; n++) {
        const cand = base + ' (' + n + ')' + ext;
        if (!taken.has(cand)) return cand;
      }
    }

    function askOverwrite(conflicts, segs) {
      return new Promise(resolve => {
        const MAX = 30;
        const n = conflicts.length;
        const list = el('ul', {}, ...conflicts.slice(0, MAX).map(it => el('li', {},
          el('span', { text: it.file.name }),
          it.rel.length ? el('small', { text: '/' + segs.concat(it.rel).join('/') } ) : null)));
        if (n > MAX) list.append(el('li', { text: '…і ще ' + (n - MAX) }));
        const back = el('div', { class: 'modal-back' });
        const done = choice => { document.removeEventListener('keydown', onKey, true); back.remove(); resolve(choice); };
        const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(null); } };
        const box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'ow-title' },
          el('h2', { id: 'ow-title', text: n === 1 ? 'Файл уже існує' : 'Файли вже існують (' + n + ')' }),
          el('p', { text: (n === 1 ? 'У папці ' + folderLabel(segs.concat(conflicts[0].rel)) + ' уже є файл з такою назвою.' : 'У цільових папках уже є файли з такими назвами.') + ' Що зробити?' }),
          list,
          el('div', { class: 'choices' },
            button('replace', 'Замінити', 'btn-danger', () => done('replace')),
            button('content_copy', 'Зберегти обидва', 'btn-primary', () => done('rename'), { title: 'Нові файли отримають назву на кшталт «назва (1).pdf»' }),
            button('skip', 'Пропустити', 'btn-soft', () => done('skip'), { title: 'Завантажити лише нові файли' }),
            button('close', 'Скасувати', 'btn-soft', () => done(null))));
        back.append(box);
        back.addEventListener('click', e => { if (e.target === back) done(null); });
        document.addEventListener('keydown', onKey, true);
        document.body.append(back);
        box.querySelector('.btn-primary').focus();
      });
    }

    // items: File[] (go into segs) or [{ file, rel: [subdir…] }] / [{ dir: true, rel: [...] }] from dropped folders
    function enqueue(items, segs) {
      if (!S.canWrite) return;
      if (!uploads.some(u => u.status === 'uploading' || u.status === 'queued')) madeDirs.clear();
      for (const it of items) {
        if (it.dir) continue;   // empty folders handled below
        const file = it instanceof File ? it : it.file;
        const rel = it instanceof File ? [] : it.rel;
        const u = {
          id: ++uploadSeq, file, segs: segs.concat(rel), isDir: false, name: it.name || file.name, total: file.size,
          status: 'queued', loaded: 0, samples: [], speed: 0, error: '', xhr: null
        };
        uploads.push(u);
        $('up-list').appendChild(createUploadRow(u));
      }
      // empty folders: create them (one quiet task per folder)
      for (const it of items) {
        if (!it.dir) continue;
        const u = { id: ++uploadSeq, file: null, segs: segs.concat(it.rel), isDir: true, name: it.rel[it.rel.length - 1] + '/',
          total: 0, status: 'queued', loaded: 0, samples: [], speed: 0, error: '', xhr: null };
        uploads.push(u);
        $('up-list').appendChild(createUploadRow(u));
      }
      $('uploads').classList.remove('hidden');
      document.body.classList.add('has-uploads');
      paintAll();
      pump();
    }
    function pump() {
      if (uploads.some(u => u.status === 'uploading')) return;
      const next = uploads.find(u => u.status === 'queued');
      if (next) startUpload(next);
    }
    // dufs PUT needs the parent folder to exist → create missing folders first (for dropped folders)
    const madeDirs = new Set();
    async function ensureDir(segs) {
      for (let i = 1; i <= segs.length; i++) {
        const sub = segs.slice(0, i), key = sub.join('/');
        if (madeDirs.has(key)) continue;
        if (!(await exists(sub))) {
          const r = await fetch(pathOf(sub), { method: 'MKCOL' });
          if (!r.ok && !(await exists(sub))) throw new Error('не вдалося створити папку «' + key + '»');
        }
        madeDirs.add(key);
      }
    }
    async function startUpload(u) {
      u.status = 'uploading';
      u.loaded = 0;
      u.samples = [{ t: performance.now(), l: 0 }];
      paintAll();
      try { await ensureDir(u.segs); }
      catch (e) { u.status = 'error'; u.error = e.message; paintAll(); pump(); return; }
      if (u.status !== 'uploading') { pump(); return; }   // cancelled while preparing
      if (u.isDir) { finishDirOnly(u); return; }
      const xhr = new XMLHttpRequest();
      u.xhr = xhr;
      xhr.open('PUT', pathOf(u.segs.concat(u.name)));
      xhr.upload.onprogress = e => {
        if (!e.lengthComputable) return;
        u.loaded = e.loaded;
        u.samples.push({ t: performance.now(), l: e.loaded });
        paintSoon();
      };
      const finish = (status, error = '') => {
        if (u.status !== 'uploading') return;
        u.status = status;
        u.error = error;
        u.xhr = null;
        if (status === 'done') {
          u.loaded = u.total;
          refreshAfterUpload(u);
          loadDisk();
        }
        paintAll();
        pump();
      };
      xhr.onload = () => (xhr.status >= 200 && xhr.status < 300)
        ? finish('done') : finish('error', xhr.status === 403 ? 'Немає прав на запис' : 'Сервер відповів ' + xhr.status);
      xhr.onerror = () => finish('error', 'Немає зв’язку з сервером');
      xhr.ontimeout = () => finish('error', 'Час очікування вичерпано');
      xhr.onabort = () => finish('cancelled');
      xhr.send(u.file);
      paintAll();
    }
    function cancelUpload(u) {
      if (u.status === 'uploading' && u.xhr) u.xhr.abort();
      else if (u.status === 'queued' || u.status === 'uploading') { u.status = 'cancelled'; paintAll(); }
    }
    let refreshTimer = null;
    function refreshAfterUpload(u) {
      // refresh if the upload landed in the current folder or anywhere below it
      const cur = S.segs.join('/'), dest = u.segs.join('/');
      if (S.mode !== 'dir' || !(dest === cur || cur === '' || dest.startsWith(cur + '/'))) return;
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(loadDir, 300);
    }
    function finishDirOnly(u) {   // empty folder from a dropped folder tree: ensureDir already created it
      u.status = 'done';
      refreshAfterUpload(u);
      paintAll();
      pump();
    }
    function retryUpload(u) { u.status = 'queued'; u.loaded = 0; u.error = ''; paintAll(); pump(); }
    function hideUploadsIfEmpty() {
      if (!uploads.length) {
        $('uploads').classList.add('hidden');
        document.body.classList.remove('has-uploads');
      }
    }
    function removeUpload(u) {
      const i = uploads.indexOf(u);
      if (i >= 0) uploads.splice(i, 1);
      u.ui.row.remove();
      hideUploadsIfEmpty();
      paintAll();
    }
    function createUploadRow(u) {
      const fill = el('div', { class: 'up-fill' });
      const info = el('div', { class: 'up-info' });
      const btn = el('button', { class: 'btn btn-ghost btn-icon', type: 'button' });
      btn.addEventListener('click', () => {
        if (u.status === 'queued' || u.status === 'uploading') cancelUpload(u);
        else if (u.status === 'error' || u.status === 'cancelled') retryUpload(u);
        else removeUpload(u);
      });
      const row = el('div', { class: 'up-item' },
        el('div', { class: 'up-main' },
          el('div', { class: 'up-name', text: u.name }),
          el('div', { class: 'up-dest', text: u.isDir ? 'нова папка в «/' + u.segs.slice(0, -1).join('/') + '»' : 'у «/' + u.segs.join('/') + '»' }),
          el('div', { class: 'up-bar' }, fill),
          info),
        btn);
      u.ui = { row, fill, info, btn };
      return row;
    }
    function currentSpeed(u, now) {
      const s = u.samples;
      while (s.length > 2 && now - s[0].t > 4000) s.shift();
      const first = s[0];
      const dt = (now - first.t) / 1000;
      return dt > 0.4 ? Math.max(0, (u.loaded - first.l) / dt) : u.speed;
    }
    function paintUpload(u, now) {
      const { row, fill, info, btn } = u.ui;
      row.className = 'up-item ' + u.status;
      const pct = u.total ? Math.min(100, u.loaded / u.total * 100) : (u.status === 'done' ? 100 : 0);
      fill.style.width = (u.status === 'done' ? 100 : pct) + '%';
      let text = '', btnIcon = 'close', btnTitle = 'Скасувати';
      if (u.status === 'queued') text = 'У черзі · ' + formatSize(u.total);
      else if (u.status === 'uploading') {
        u.speed = currentSpeed(u, now);
        const left = u.total - u.loaded;
        text = formatSize(u.loaded) + ' з ' + formatSize(u.total) + ' · ' + Math.floor(pct) + '%'
          + ' · ' + formatSize(u.speed) + '/с' + (u.speed > 0 ? ' · ~' + formatEta(left / u.speed) : '');
      } else if (u.status === 'done') { text = 'Готово · ' + formatSize(u.total); btnIcon = 'check'; btnTitle = 'Прибрати зі списку'; }
      else if (u.status === 'error') { text = 'Помилка: ' + u.error; btnIcon = 'replay'; btnTitle = 'Повторити'; }
      else { text = 'Скасовано'; btnIcon = 'replay'; btnTitle = 'Повторити'; }
      info.textContent = text;
      if (btn.dataset.icon !== btnIcon) { setBtn(btn, btnIcon, ''); btn.dataset.icon = btnIcon; }
      btn.title = btnTitle;
      btn.setAttribute('aria-label', btnTitle);
    }
    function paintSummary(now) {
      const live = uploads.filter(u => u.status === 'uploading' || u.status === 'queued');
      const active = uploads.find(u => u.status === 'uploading');
      const doneCount = uploads.filter(u => u.status === 'done').length;
      if (live.length) {
        const totalBytes = live.reduce((s, u) => s + u.total, 0);
        const doneBytes = live.reduce((s, u) => s + (u.status === 'uploading' ? u.loaded : 0), 0);
        const pct = totalBytes ? Math.floor(doneBytes / totalBytes * 100) : 0;
        const speed = active ? currentSpeed(active, now) : 0;
        const left = totalBytes - doneBytes;
        $('up-title').textContent = 'Завантаження: ' + live.length + (live.length === 1 ? ' файл' : ' файлів');
        $('up-detail').textContent = formatSize(doneBytes) + ' з ' + formatSize(totalBytes) + ' · ' + pct + '%'
          + (speed > 0 ? ' · ' + formatSize(speed) + '/с · ~' + formatEta(left / speed) : '');
      } else {
        $('up-title').textContent = 'Завершено: ' + doneCount;
        $('up-detail').textContent = '';
      }
      $('up-clear').disabled = !uploads.some(u => u.status === 'done' || u.status === 'cancelled');
    }
    function paintAll() {
      paintTimer = null;
      const now = performance.now();
      uploads.forEach(u => paintUpload(u, now));
      paintSummary(now);
    }
    function paintSoon() { if (!paintTimer) paintTimer = setTimeout(paintAll, 250); }

    setBtn($('up-clear'), 'clear_all', '');
    $('up-clear').addEventListener('click', () => {
      for (let i = uploads.length - 1; i >= 0; i--) {
        if (uploads[i].status === 'done' || uploads[i].status === 'cancelled') { uploads[i].ui.row.remove(); uploads.splice(i, 1); }
      }
      hideUploadsIfEmpty();
      paintAll();
    });
    const toggleBtn = $('up-toggle');
    const syncToggle = () => setBtn(toggleBtn, $('uploads').classList.contains('collapsed') ? 'expand_less' : 'expand_more', '');
    syncToggle();
    toggleBtn.addEventListener('click', () => { $('uploads').classList.toggle('collapsed'); syncToggle(); });
    setInterval(() => { if (uploads.some(u => u.status === 'uploading')) paintAll(); }, 500);

    /* ---------- routing ---------- */
    function parseLocation() {
      S.segs = location.pathname.split('/').filter(Boolean).map(decodeSeg);
      S.mode = new URLSearchParams(location.search).has('view') && S.segs.length ? 'file' : 'dir';
    }

    function render() {
      parseLocation();
      S.editor = null;
      revokeBlobs();
      closePdf();
      document.querySelectorAll('.note').forEach(n => n.remove());
      const isFile = S.mode === 'file';
      document.body.classList.toggle('mode-file', isFile);
      $('dir-view').classList.toggle('hidden', isFile);
      $('file-view').classList.toggle('hidden', !isFile);
      // stop media playing from the previous page
      $('stage').querySelectorAll('video,audio').forEach(m => { m.pause(); m.removeAttribute('src'); m.load(); });
      if (isFile) showFile();
      else {
        $('search').value = '';
        S.searchResults = null;
        showDir();
      }
      window.scrollTo(0, 0);
    }

    function navigate(href, replace) {
      const url = new URL(href, location.href);
      if (url.pathname + url.search + url.hash === location.pathname + location.search + location.hash) return;
      if (editorDirty() && !confirm('Є незбережені зміни. Вийти без збереження?')) return;
      history[replace ? 'replaceState' : 'pushState'](null, '', url.pathname + url.search + url.hash);
      render();
    }

    document.addEventListener('click', e => {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target.closest('a');
      if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
      const url = new URL(a.href, location.href);
      if (url.origin !== location.origin) return;
      if (a.hasAttribute('data-spa')) {
        e.preventDefault();
        navigate(url.pathname + url.search + url.hash);
        return;
      }
      // links inside rendered markdown: open vault files in the viewer, folders in the browser
      if (a.closest('.md') && !url.search) {
        e.preventDefault();
        if (url.hash && url.pathname === location.pathname) { location.hash = url.hash; return; }
        navigate(url.pathname.endsWith('/') ? url.pathname : url.pathname + '?view');
      }
    });

    window.addEventListener('popstate', () => {
      if (editorDirty() && !confirm('Є незбережені зміни. Вийти без збереження?')) {
        // stay: restore editor URL
        history.pushState(null, '', editHref(S.editor.segs));
        return;
      }
      render();
    });
    window.addEventListener('beforeunload', e => {
      if (editorDirty() || uploads.some(u => u.status === 'uploading' || u.status === 'queued')) { e.preventDefault(); e.returnValue = ''; }
    });

    document.addEventListener('keydown', e => {
      if (S.mode !== 'file' || S.editor || !fileCtx) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'video' || tag === 'audio' || e.ctrlKey || e.metaKey || e.altKey) return;
      const { siblings, idx, segs } = fileCtx;
      if (e.key === 'Escape') navigate(dirHref(segs.slice(0, -1)));
      else if (siblings.length > 1 && idx >= 0 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        const n = siblings[(idx + (e.key === 'ArrowLeft' ? -1 : 1) + siblings.length) % siblings.length];
        navigate(viewHref(segs.slice(0, -1).concat(n.name)));
      }
    });

    /* ---------- login / logout ---------- */
    // Cookie docs_auth=1 = "writer mode" for the proxy in front of dufs:
    // without it everyone is an anonymous reader (proxy strips credentials);
    // with it the proxy requires a login (the browser's own login dialog).
    const setWriterMode = on => { document.cookie = 'docs_auth=' + (on ? '1; max-age=31536000' : '; max-age=0') + '; path=/; SameSite=Lax'; };

    function login() {
      setWriterMode(true);
      // fresh ?login=… → the browser treats it as a new page and shows its login dialog
      const u = new URL(location.href);
      u.searchParams.set('login', Date.now());
      location.replace(u.href);
    }

    function logout() {
      const busy = uploads.some(u => u.status === 'uploading' || u.status === 'queued');
      if (busy && !confirm('Завантаження ще тривають і будуть перервані. Вийти?')) return;
      if (editorDirty() && !confirm('Є незбережені зміни. Вийти без збереження?')) return;
      if (S.editor) S.editor.original = S.editor.ta.value;   // suppress beforeunload prompt
      uploads.forEach(u => { if (u.xhr) u.xhr.abort(); u.status = 'cancelled'; });
      setWriterMode(false);
      location.reload();   // same page, now as an anonymous reader
    }

    /* ---------- folder toolbar + drag & drop ---------- */
    $('search-icon').innerHTML = iconHtml('search');
    setBtn($('upload-btn'), 'upload', 'Завантажити');
    setBtn($('note-btn'), 'note_add', 'Нотатка');
    setBtn($('mkdir-btn'), 'create_new_folder', 'Папка');
    setBtn($('logout-btn'), 'logout', '');
    setBtn($('login-btn'), 'login', 'Увійти');
    $('login-btn').addEventListener('click', login);
    $('logout-btn').addEventListener('click', logout);
    $('upload-btn').addEventListener('click', () => $('file-input').click());
    $('note-btn').addEventListener('click', newNote);
    $('mkdir-btn').addEventListener('click', makeFolder);
    $('file-input').addEventListener('change', () => {
      const fi = $('file-input');
      if (fi.files.length) uploadItems(Array.from(fi.files), S.segs);
      fi.value = '';
    });
    $('search').addEventListener('input', onSearchInput);
    $('deep').addEventListener('change', onSearchInput);
    $('sort').addEventListener('change', () => { localStorage.setItem('docs.sort', $('sort').value); renderList(); });
    try { const s = localStorage.getItem('docs.sort'); if (s) $('sort').value = s; } catch (_) {}

    /* drag & drop:
       - files/folders from the computer → onto a folder row / path item (or anywhere in the folder view = current folder)
       - rows already in the list → onto a folder row / path item = move */
    const MOVE_TYPE = 'application/x-docs-move';
    const dtTypes = e => Array.from((e.dataTransfer && e.dataTransfer.types) || []);
    const isInternal = e => dtTypes(e).includes(MOVE_TYPE);
    const isExternal = e => !isInternal(e) && dtTypes(e).includes('Files');
    const folderLabel = segs => segs.length ? '«' + segs[segs.length - 1] + '»' : '«Головна»';
    let dropEl = null;

    function clearDrag() {
      if (dropEl) dropEl.classList.remove('drop-target');
      dropEl = null;
      $('drop-hint').classList.add('hidden');
    }
    function targetOf(e) {
      const t = e.target.closest && e.target.closest('[data-drop]');
      if (t) return { node: t, segs: JSON.parse(t.dataset.drop) };
      if (S.mode === 'dir' && isExternal(e)) return { node: null, segs: S.segs };   // page = current folder
      return null;
    }

    document.addEventListener('dragover', e => {
      if (!S.canWrite || !(isExternal(e) || isInternal(e))) return;
      const tgt = targetOf(e);
      if (!tgt) { if (dropEl) clearDrag(); return; }
      e.preventDefault();
      e.dataTransfer.dropEffect = isInternal(e) ? 'move' : 'copy';
      if (dropEl !== tgt.node) {
        if (dropEl) dropEl.classList.remove('drop-target');
        dropEl = tgt.node;
        if (dropEl) dropEl.classList.add('drop-target');
      }
      if (isExternal(e)) {
        $('drop-label').textContent = 'Завантажити в ' + folderLabel(tgt.segs);
        $('drop-hint').classList.remove('hidden');
      }
    });
    document.addEventListener('dragleave', e => {
      // left the window entirely
      if (!e.relatedTarget || e.relatedTarget === document.documentElement) clearDrag();
    });
    document.addEventListener('drop', e => {
      const internal = isInternal(e), external = isExternal(e);
      const tgt = (internal || external) && S.canWrite ? targetOf(e) : null;
      const raw = internal ? e.dataTransfer.getData(MOVE_TYPE) : '';
      // directory entries must be grabbed synchronously, before any await
      const entries = external ? Array.from(e.dataTransfer.items || []).map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()) : [];
      const files = external ? Array.from(e.dataTransfer.files) : [];
      clearDrag();
      if (!tgt) return;
      e.preventDefault();
      if (internal) {
        try { moveInto(JSON.parse(raw), tgt.segs); } catch (_) {}
      } else {
        collectDropped(entries, files).then(items => { if (items.length) uploadItems(items, tgt.segs); });
      }
    });

    /* paste (Ctrl+V / ⌘V) in a folder → upload clipboard files there */
    function clipboardFiles(cd) {
      let files = Array.from((cd && cd.files) || []);
      if (!files.length) files = Array.from((cd && cd.items) || []).filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
      return files;
    }
    document.addEventListener('paste', e => {
      if (!S.canWrite || S.mode !== 'dir') return;
      const t = e.target, tag = ((t && t.tagName) || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || (t && t.isContentEditable) || document.querySelector('.modal-back')) return;
      const files = clipboardFiles(e.clipboardData);
      if (!files.length) return;
      e.preventDefault();
      // screenshots / copied images arrive as "image.png" → give them a readable, unique name
      const d = new Date(), p2 = n => String(n).padStart(2, '0');
      const stamp = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + '-' + p2(d.getMinutes()) + '-' + p2(d.getSeconds());
      let n = 0;
      const named = files.map(f => /^image\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name)
        ? new File([f], 'Знімок ' + stamp + (files.length > 1 ? ' (' + (++n) + ')' : '') + '.' + extOf(f.name), { type: f.type, lastModified: Date.now() })
        : f);
      uploadItems(named, S.segs);
    });

    async function moveInto(src, targetSegs) {
      const name = src.segs[src.segs.length - 1];
      const from = src.segs.join('/'), to = targetSegs.join('/');
      if (to === src.segs.slice(0, -1).join('/') || to === from) return;   // already there / onto itself
      if (src.dir && to.startsWith(from + '/')) { toast('Не можна перемістити папку всередину себе'); return; }
      const dest = targetSegs.concat(name);
      if (await exists(dest)) { alert('У папці ' + folderLabel(targetSegs) + ' вже є «' + name + '»'); return; }
      const res = await fetch(pathOf(src.segs), { method: 'MOVE', headers: { 'Destination': location.origin + pathOf(dest) } }).catch(() => null);
      if (!res || !res.ok) { alert('Не вдалося перемістити' + (res ? ' (статус ' + res.status + ')' : '')); return; }
      madeDirs.clear();
      toast('«' + name + '» → ' + folderLabel(targetSegs));
      if (S.mode === 'dir') loadDir();
    }

    // turn dropped items into upload items, walking dropped folders recursively
    async function collectDropped(entries, files) {
      if (!entries.length || !entries.some(en => en && en.isDirectory)) return files;
      const out = [];
      const readAll = reader => new Promise((resolve, reject) => {
        const acc = [];
        const step = () => reader.readEntries(batch => { if (!batch.length) resolve(acc); else { acc.push(...batch); step(); } }, reject);
        step();
      });
      const fileOf = en => new Promise((resolve, reject) => en.file(resolve, reject));
      async function walk(en, rel) {
        if (en.isFile) { out.push({ file: await fileOf(en), rel }); return; }
        const children = await readAll(en.createReader());
        const sub = rel.concat(en.name);
        if (!children.length) out.push({ dir: true, rel: sub });
        for (const c of children) await walk(c, sub);
      }
      try {
        for (const en of entries) if (en) await walk(en, []);
      } catch (err) {
        alert('Не вдалося прочитати перетягнуту папку: ' + err.message);
        return [];
      }
      return out;
    }

    /* ---------- floating "back to top" ---------- */
    setBtn($('to-top'), 'arrow_upward', '');
    $('to-top').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    let topTick = false;
    window.addEventListener('scroll', () => {
      if (topTick) return;
      topTick = true;
      requestAnimationFrame(() => { topTick = false; $('to-top').classList.toggle('hidden', window.scrollY < 500); });
    }, { passive: true });

    /* ---------- start ---------- */
    // drop the one-time ?login=… parameter (see login()) from the address bar
    if (new URLSearchParams(location.search).has('login')) {
      const u = new URL(location.href);
      u.searchParams.delete('login');
      history.replaceState(null, '', u.pathname + u.search + u.hash);
    }
    // arrived here from the proxy's "not found" page → say what was missing
    try {
      const miss = sessionStorage.getItem('docs.missing');
      if (miss) { sessionStorage.removeItem('docs.missing'); setTimeout(() => toast('Не знайдено: ' + miss, 4500), 300); }
    } catch (_) {}
    (async () => {
      render();
      if (await loadDisk()) setInterval(loadDisk, 60000);
    })();
  </script>
</body>
</html>
