<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Документація</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b82f6'/%3E%3Cpath d='M9 6h9.5l5.5 5.5V25a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z' fill='%23fff'/%3E%3Cpath d='M18.5 6v5.5H24z' fill='%23bfdbfe'/%3E%3Cpath d='M11.5 15.5h9M11.5 19h9M11.5 22.5h5.5' stroke='%233b82f6' stroke-width='1.7' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #3b82f6;
      --accent-strong: #1d4ed8;
      --accent-soft: #eff6ff;
      --danger: #ef4444;
      --warn: #f59e0b;
      --success: #16a34a;
      --neutral: #64748b;
      --on-color: #ffffff;
      --c-video: #8b5cf6; --c-audio: #ec4899; --c-image: #10b981; --c-pdf: #ef4444;
      --c-text: #3b82f6; --c-table: #16a34a; --c-archive: #f59e0b; --c-other: #64748b; --c-docx: #2b6cb0; --c-xlsx: #1e7e45;

      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 2px 10px rgba(0,0,0,.07);
      --shadow-hover: 0 6px 18px rgba(0,0,0,.12);
      --shadow-pop: 0 10px 30px rgba(0,0,0,.25);
      --gap: 10px;
      --page-width: 1000px;
      --view-width: 1400px;
      --btn-height: 42px;
      --icon-size: 22px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --crumb-cur: #1d4ed8;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a; --surface: #1e293b; --surface-2: #172033; --text: #e2e8f0; --muted: #94a3b8;
        --border: #334155; --accent-soft: #1e3a5f; --shadow: 0 2px 10px rgba(0,0,0,.4);
        --shadow-hover: 0 6px 18px rgba(0,0,0,.5); --crumb-cur: #93c5fd; --c-docx: #63b3ed; --c-xlsx: #48bb78;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: var(--page-width); margin: 0 auto; padding: 24px 20px 40px; }
    body.mode-file .container { max-width: var(--view-width); }
    body.has-uploads .container { padding-bottom: 260px; }
    .hidden { display: none !important; }
    .icon { display: inline-flex; flex-shrink: 0; }
    .icon svg { width: var(--icon-size); height: var(--icon-size); fill: currentColor; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    body.ro .rw { display: none !important; }
    body.nodel .del { display: none !important; }

    /* buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: var(--btn-height); padding: 0 16px; border: none; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 15px; font-weight: 500; line-height: 1.2; white-space: nowrap;
      color: var(--on-color); background: var(--neutral); text-decoration: none; cursor: pointer;
      transition: filter .15s, background .15s;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:disabled { opacity: .55; cursor: default; filter: none; }
    .btn-icon { padding: 0; width: var(--btn-height); flex-shrink: 0; }
    .btn-primary { background: var(--accent); }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    .btn-ghost { background: transparent; color: var(--muted); }
    .btn-ghost:hover { background: var(--accent-soft); color: var(--accent); filter: none; }
    .btn-soft { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    .btn-soft:hover { color: var(--accent); filter: none; }

    /* top bar */
    .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .who { display: flex; align-items: center; gap: 2px; padding: 3px 3px 3px 12px; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow); flex-shrink: 0; }
    .who .role { color: var(--muted); cursor: default; }
    .who.rw .role { color: var(--success); }
    .who .btn { border-radius: 999px; min-height: 38px; width: 38px; }

    .disk { display: flex; align-items: center; gap: 8px; min-width: 160px; font-size: 13px; color: var(--muted); }
    .disk-bar { flex: 1; height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; min-width: 80px; }
    .disk-fill { height: 100%; width: 0; background: var(--success); transition: width .4s; }
    .disk.warn .disk-fill { background: var(--warn); }
    .disk.crit .disk-fill { background: var(--danger); }

    /* breadcrumbs (path bar) */
    .crumbs {
      flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
      min-height: var(--btn-height); padding: 4px 6px; font-size: 16px;
      background: var(--surface); border-radius: var(--radius-sm); box-shadow: var(--shadow);
    }
    .crumbs a, .crumbs .cur {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px;
      color: var(--text); text-decoration: none; overflow-wrap: anywhere; line-height: 1.25;
    }
    .crumbs a .icon { color: var(--accent); }
    .crumbs a:hover { background: var(--accent-soft); color: var(--accent); }
    .crumbs .cur { background: var(--accent-soft); color: var(--crumb-cur); font-weight: 600; }
    .crumbs .sep { display: inline-flex; color: var(--muted); }
    .crumbs .icon svg { width: 18px; height: 18px; }

    /* toolbar */
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0; }
    .search {
      flex: 1 1 260px; display: flex; align-items: center; gap: 10px; min-height: var(--btn-height);
      padding: 0 14px; background: var(--surface); border: 2px solid var(--border);
      border-radius: var(--radius-sm); color: var(--muted);
    }
    .search:focus-within { border-color: var(--accent); color: var(--accent); }
    .search input {
      flex: 1; min-width: 0; border: none; outline: none; background: transparent;
      font-family: inherit; font-size: 16px; color: var(--text); padding: 8px 0;
    }
    .search label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }
    select.sort {
      min-height: var(--btn-height); padding: 0 10px; border-radius: var(--radius-sm); border: 2px solid var(--border);
      background: var(--surface); color: var(--text); font-family: inherit; font-size: 14px;
    }

    /* listing */
    .list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .row { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 16px; border-bottom: 1px solid var(--border); min-height: 56px; }
    .row:last-child { border-bottom: none; }
    .row:hover { background: var(--surface-2); }
    .row .t-icon .icon svg { width: 26px; height: 26px; }
    .row-main { flex: 1; min-width: 0; color: inherit; text-decoration: none; display: flex; flex-direction: column; gap: 2px; }
    .row-name { font-weight: 500; overflow-wrap: anywhere; line-height: 1.3; }
    .row-main:hover .row-name { color: var(--accent); }
    .row-path { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .row-meta { font-size: 13px; color: var(--muted); white-space: nowrap; text-align: right; }
    .row-actions { display: flex; gap: 2px; }
    .row.dir .row-name { font-weight: 600; }
    .empty { padding: 36px 16px; text-align: center; color: var(--muted); }

    .t-video { color: var(--c-video); } .t-audio { color: var(--c-audio); } .t-image { color: var(--c-image); }
    .t-pdf { color: var(--c-pdf); } .t-text, .t-md { color: var(--c-text); } .t-csv { color: var(--c-table); }
    .t-archive { color: var(--c-archive); } .t-other, .t-legacy { color: var(--c-other); } .t-dir { color: var(--accent); }
    .t-model { color: #f97316; }

    /* PDF viewer */
    .stage.pdfv { background: transparent; box-shadow: none; }
    .pdf-pages { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 12px; overflow-x: auto;
      background: var(--surface-2); border-radius: var(--radius); }
    .pdf-page { position: relative; flex-shrink: 0; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
    .pdf-page canvas { display: block; width: 100%; height: 100%; }
    .stage.model { background: var(--surface-2); display: flex; flex-direction: column; align-items: center; }
    .stage.model .sheet-tabs { align-self: stretch; background: var(--surface); }
    .model-view { display: flex; justify-content: center; align-items: center; align-self: stretch; }
    .stage.model canvas { display: block; max-width: 100%; }
    .t-docx, .t-odt { color: var(--c-docx); } .t-xlsx, .t-ods { color: var(--c-xlsx); }

    /* docx: rendered as a white "paper" page in both themes */
    .stage.docx { background: var(--surface-2); padding: 20px; }
    .docx-page {
      background: #fff; color: #1f2937; max-width: 860px; margin: 0 auto; padding: 48px 56px; border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,.15); font-family: Calibri, Carlito, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 15px; line-height: 1.5; overflow-wrap: anywhere;
    }
    .docx-page p, .docx-page li, .docx-page h1, .docx-page h2, .docx-page h3, .docx-page h4, .docx-page h5, .docx-page h6 { white-space: pre-wrap; tab-size: 6; }
    .docx-page p { margin: 0 0 .45em; }
    .docx-page h1, .docx-page h2, .docx-page h3, .docx-page h4, .docx-page h5, .docx-page h6 { margin: .8em 0 .4em; line-height: 1.25; color: #1e3a8a; }
    .docx-page h1 { font-size: 1.7em; } .docx-page h2 { font-size: 1.4em; } .docx-page h3 { font-size: 1.2em; }
    .docx-page h4, .docx-page h5, .docx-page h6 { font-size: 1.05em; }
    .docx-page ul, .docx-page ol { padding-left: 1.6em; margin: 0 0 .5em; }
    .docx-page .tbl { overflow-x: auto; margin: .5em 0; }
    .docx-page table { border-collapse: collapse; width: 100%; }
    .docx-page td { border: 1px solid #cbd5e1; padding: 4px 8px; vertical-align: top; }
    .docx-page td.vm { border-top-color: transparent; }
    .docx-page td p:last-child, .docx-page li > p { margin-bottom: 0; }
    .docx-page img { max-width: 100%; height: auto; }
    .docx-page a { color: #2563eb; }
    .docx-page hr.pb { border: 0; border-top: 2px dashed #cbd5e1; margin: 1.5em 0; }
    .docx-noimg { color: #6b7280; font-style: italic; }

    /* xlsx */
    .sheet-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-bottom: 1px solid var(--border); }
    .sheet-tabs button { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; }
    .sheet-tabs button:hover { background: var(--surface-2); color: var(--text); }
    .sheet-tabs button.on { background: var(--accent-soft); color: var(--crumb-cur); font-weight: 600; }
    .xl td { white-space: pre-wrap; }
    .xl td.num { text-align: right; white-space: nowrap; }
    .xl th.col { text-align: center; color: var(--muted); font-weight: 500; min-width: 48px; }

    .drop-hint {
      position: fixed; inset: 8px; z-index: 40; display: flex; align-items: flex-end; justify-content: center;
      border: 3px dashed var(--accent); border-radius: var(--radius); pointer-events: none; padding-bottom: 24px;
    }
    .drop-hint span {
      padding: 10px 20px; border-radius: 999px; background: var(--accent); color: var(--on-color);
      font-size: 16px; font-weight: 600; box-shadow: var(--shadow-pop); max-width: 90vw; overflow-wrap: anywhere; text-align: center;
    }
    .drop-target { outline: 3px solid var(--accent) !important; outline-offset: -3px; background: var(--accent-soft) !important; }
    .row.dragging { opacity: .45; }
    .row[draggable="true"] { cursor: grab; }

    /* file view */
    /* file header: name on its own line(s), size/date under it, buttons on a separate row */
    .view-head { display: flex; flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 12px; }
    .view-title { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
    .view-title > .icon { margin-top: 2px; }
    .view-name-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .view-title h1 { font-size: 20px; font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
    .view-title .meta { font-size: 13px; color: var(--muted); }
    /* buttons stretch evenly across the full width of the preview (no empty space on the right) */
    .view-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .view-actions > .btn { flex: 1 1 0; min-width: var(--btn-height); }
    .stage { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .stage.media { background: #000; display: flex; align-items: center; justify-content: center; }
    .stage video { display: block; width: 100%; max-height: calc(100vh - 170px); background: #000; }
    .stage.audio { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .stage.audio .icon svg { width: 72px; height: 72px; }
    .stage.audio audio { width: min(640px, 100%); }
    .stage.image { background: var(--surface-2); display: flex; justify-content: center; padding: 12px; }
    .stage.image img { max-width: 100%; max-height: calc(100vh - 190px); object-fit: contain; cursor: zoom-in; }
    .stage.image.zoom img { max-height: none; cursor: zoom-out; }
    .stage iframe { display: block; width: 100%; height: calc(100vh - 160px); min-height: 480px; border: 0; background: #fff; }
    .stage.text pre { margin: 0; padding: 18px 20px; font-family: var(--mono); font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4; }
    .stage.nopreview { padding: 48px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .stage.nopreview .icon svg { width: 64px; height: 64px; }
    /* big buttons on the "no preview" screen: always with text, side by side or stacked on phones */
    .np-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: min(440px, 100%); }
    .stage .np-actions .btn { flex: 1 1 190px; width: auto; padding: 0 18px; min-height: 48px; }
    .stage .np-actions .btn .lbl { display: inline !important; }
    .media-error { color: #fff; padding: 40px 20px; text-align: center; }
    .note { font-size: 13px; color: var(--muted); margin-top: 8px; }

    /* markdown */
    .md { padding: 24px 32px; line-height: 1.65; font-size: 16px; overflow-wrap: anywhere; }
    .md > * + * { margin-top: .8em; }
    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { line-height: 1.3; margin-top: 1.3em; }
    .md h1:first-child, .md h2:first-child, .md h3:first-child { margin-top: 0; }
    .md h1 { font-size: 1.8em; border-bottom: 1px solid var(--border); padding-bottom: .2em; }
    .md h2 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: .2em; }
    .md h3 { font-size: 1.2em; }
    .md a { color: var(--accent); }
    .md ul, .md ol { padding-left: 1.6em; }
    .md li + li { margin-top: .25em; }
    .md li.task { list-style: none; margin-left: -1.3em; }
    .md li.task input { margin-right: .5em; }
    .md code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); border: 1px solid var(--border); padding: .1em .35em; border-radius: 5px; }
    .md pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
    .md pre code { background: none; border: 0; padding: 0; font-size: 14px; }
    .md blockquote { border-left: 4px solid var(--accent); padding: .2em 1em; color: var(--muted); background: var(--surface-2); border-radius: 0 8px 8px 0; }
    .md hr { border: 0; border-top: 1px solid var(--border); }
    .md img { max-width: 100%; border-radius: 6px; }
    .md table, .csv table { border-collapse: collapse; }
    .md th, .md td, .csv th, .csv td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
    .md th, .csv th { background: var(--surface-2); font-weight: 600; }
    .md .tbl { overflow-x: auto; }
    .csv { overflow: auto; max-height: calc(100vh - 170px); font-size: 14px; }
    .csv th { position: sticky; top: 0; }
    .csv td.n { color: var(--muted); text-align: right; }

    /* editor */
    .editor { display: flex; flex-direction: column; }
    .editor textarea {
      display: block; width: 100%; min-height: calc(100vh - 200px); resize: vertical; border: 0; outline: none;
      padding: 18px 20px; font-family: var(--mono); font-size: 14px; line-height: 1.55; tab-size: 4;
      background: var(--surface); color: var(--text);
    }
    .stage.editor { position: relative; }
    .editor textarea.md { padding-right: 56px; }   /* keep text clear of the help button */
    .md-help {
      position: absolute; top: 8px; right: 8px; width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; text-decoration: none;
      color: var(--accent); background: var(--accent-soft); opacity: .85; transition: opacity .15s;
    }
    .md-help { border: 0; padding: 0; cursor: pointer; }
    .md-help:hover, .md-help:focus-visible { opacity: 1; }
    /* Markdown cheat sheet */
    .modal.cheat { width: min(760px, 100%); }
    .cs-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .cs-list { display: flex; flex-direction: column; gap: 14px; }
    .cs-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .cs-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cs-src {
      text-align: left; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2);
      color: var(--text); padding: 8px 10px; cursor: pointer; font: inherit; overflow-x: auto;
    }
    .cs-src:hover, .cs-src:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
    .cs-src pre { margin: 0; font-family: var(--mono); font-size: 13px; line-height: 1.5; white-space: pre; }
    .cs-out { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 14px; line-height: 1.5; color: var(--text); }
    .cs-out.md > * + * { margin-top: .4em; }
    .cs-out.md h1 { font-size: 1.4em; } .cs-out.md h2 { font-size: 1.2em; } .cs-out.md h3 { font-size: 1.05em; }
    .cs-out.md h1, .cs-out.md h2 { border: 0; padding: 0; margin-top: 0; }
    .cs-out a { pointer-events: none; }   /* examples are not real links */
    .cs-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
    @media (max-width: 560px) { .cs-pair { grid-template-columns: 1fr; } }
    .md-help svg { width: 24px; height: 24px; fill: currentColor; }
    .editor-status { font-size: 13px; color: var(--muted); padding: 8px 14px; border-top: 1px solid var(--border); display: flex; gap: 16px; }
    .editor-status .dirty { color: var(--warn); font-weight: 600; }

    /* uploads panel */
    .uploads {
      position: fixed; right: 16px; bottom: 16px; z-index: 50; width: min(480px, calc(100vw - 32px));
      display: flex; flex-direction: column; max-height: 60vh;
      background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-pop); overflow: hidden;
    }
    .up-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 16px; }
    .up-summary { flex: 1; min-width: 0; }
    .up-title { font-weight: 600; }
    .up-detail { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .up-list { overflow-y: auto; border-top: 1px solid var(--border); }
    .uploads.collapsed .up-list { display: none; }
    .up-item { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--border); }
    .up-item:last-child { border-bottom: none; }
    .up-main { flex: 1; min-width: 0; }
    .up-name { font-weight: 500; overflow-wrap: anywhere; line-height: 1.3; }
    .up-dest { font-size: 12px; color: var(--muted); margin-bottom: 6px; overflow-wrap: anywhere; }
    .up-bar { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
    .up-fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    .up-item.done .up-fill { background: var(--success); }
    .up-item.error .up-fill { background: var(--danger); }
    .up-item.cancelled .up-fill { background: var(--neutral); }
    .up-info { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    .up-item.error .up-info { color: var(--danger); }

    /* hidden / password-protected folders */
    .row-badge { display: inline-flex; vertical-align: -3px; margin-left: 6px; color: var(--muted); }
    .row-badge .icon svg { width: 16px; height: 16px; }
    .row-badge.hid { color: #d97706; }
    button.row-badge { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; }
    .unlock { max-width: 400px; margin: 0 auto; padding: 36px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
    .unlock > .icon svg { width: 48px; height: 48px; color: var(--accent); }
    .unlock h2 { font-size: 19px; color: var(--text); overflow-wrap: anywhere; }
    .unlock p { color: var(--muted); }
    .unlock-form { display: flex; gap: 8px; width: 100%; }
    .unlock-form .btn .lbl { display: inline !important; }
    .unlock-msg { color: var(--danger); min-height: 1.4em; }
    .txt-in { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font: inherit; font-size: 16px; }
    .txt-in:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .acc-opts { display: flex; flex-direction: column; gap: 8px; }
    .acc-opts label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; }
    .acc-opts label:has(input:checked) { border-color: var(--accent); background: var(--surface-2); }
    .acc-opts input { margin-top: 3px; }
    .acc-opts b { display: block; }
    .acc-opts small { display: block; color: var(--muted); line-height: 1.35; }
    .acc-pw { display: flex; flex-direction: column; gap: 6px; }
    .acc-err { color: var(--danger); min-height: 1.2em; }
    .modal-back { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal { width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow-pop); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .modal h2 { font-size: 19px; }
    .modal p { color: var(--muted); line-height: 1.4; }
    .modal ul { list-style: none; border: 1px solid var(--border); border-radius: var(--radius-sm); max-height: 220px; overflow: auto; }
    .modal li { padding: 8px 12px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; font-size: 14px; }
    .modal li:last-child { border-bottom: none; }
    .modal li small { display: block; color: var(--muted); }
    .modal .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .modal .choices .btn { width: 100%; padding: 0 12px; }
    .modal .btn .lbl { display: inline !important; }   /* keep labels on phones too */
    /* floating "back to top" button, semi-transparent */
    .to-top {
      position: fixed; right: 18px; bottom: 18px; z-index: 45; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      background: rgba(15, 23, 42, .45); color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.2);
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); transition: background .2s;
    }
    .to-top:hover, .to-top:focus-visible { background: rgba(15, 23, 42, .75); }
    .to-top .icon svg { width: 26px; height: 26px; }
    @media (prefers-color-scheme: dark) {
      .to-top { background: rgba(226, 232, 240, .35); color: #0f172a; }
      .to-top:hover, .to-top:focus-visible { background: rgba(226, 232, 240, .6); }
    }
    body.has-uploads .to-top { right: auto; left: 18px; }   /* don't cover the uploads panel */
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60;
      padding: 10px 18px; border-radius: 10px; background: var(--text); color: var(--bg); font-size: 14px;
      box-shadow: var(--shadow-pop);
    }

    @media (max-width: 700px) {
      .container { padding: 14px 10px 30px; }
      .row { padding: 8px 6px 8px 10px; gap: 10px; }
      .row-meta { display: none; }
      .row-main .row-sub { display: block; }
      .md { padding: 16px; }
      .stage.docx { padding: 8px; }
      .docx-page { padding: 20px 16px; }
      .btn .lbl { display: none; }
      .btn:has(.lbl) { padding: 0; width: var(--btn-height); }
      .uploads { right: 8px; left: 8px; bottom: 8px; width: auto; }
      .disk { display: none; }
    }
    .row-sub { display: none; font-size: 12px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

      if (b < 1048576) return num(b / 1024) + ' КБ';
      if (b < 1073741824) return num(b / 1048576) + ' МБ';
      if (b < 1099511627776) return num(b / 1073741824) + ' ГБ';
      return num(b / 1099511627776) + ' ТБ';
    }
    function formatEta(sec) {
      if (!isFinite(sec) || sec < 0) return '…';
      sec = Math.round(sec);
      if (sec < 60) return sec + ' с';
      if (sec < 3600) return Math.floor(sec / 60) + ' хв ' + (sec % 60) + ' с';
      return Math.floor(sec / 3600) + ' год ' + Math.floor((sec % 3600) / 60) + ' хв';
    }
    function formatDate(m) {
      if (m == null || m === '') return '';
      const d = new Date(typeof m === 'number' ? m : (/^\d+$/.test(m) ? Number(m) : m));
      if (isNaN(d)) return '';
      return d.toLocaleString('uk-UA', { dateStyle: 'medium', timeStyle: 'short' });
    }
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function el(tag, props = {}, ...children) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? '' : v);
      }
      node.append(...children.filter(c => c != null));
      return node;
    }
    function setBtn(btn, iconName, label) {
      btn.replaceChildren(icon(iconName));
      if (label) btn.appendChild(el('span', { class: 'lbl', text: label }));
    }
    function button(iconName, label, cls, onclick, opts = {}) {
      const b = el('button', { class: 'btn ' + (cls || 'btn-soft'), type: 'button',
        title: opts.title || label, 'aria-label': opts.title || label, onclick });
      if (opts.iconOnly) { b.classList.add('btn-icon'); setBtn(b, iconName, ''); }
      else setBtn(b, iconName, label);
      return b;
    }
    function linkBtn(iconName, label, cls, href, opts = {}) {
      const a = el('a', { class: 'btn ' + (cls || 'btn-soft'), href, title: opts.title || label, 'aria-label': opts.title || label,
        download: opts.download, target: opts.target, rel: opts.target ? 'noopener' : null });
      if (opts.iconOnly) { a.classList.add('btn-icon'); setBtn(a, iconName, ''); }
      else setBtn(a, iconName, label);
      return a;
    }

    let toastTimer = null;
    function toast(msg, ms = 2200) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.add('hidden'), ms);
    }

    // link to something that no longer exists → go to the deepest folder of that path that still exists
    async function goNearestExisting(segs) {
      for (let k = segs.length - 1; k >= 0; k--) {
        const dir = segs.slice(0, k);
        try {
          const d = await getJson(dirHref(dir) + '?json');
          if (d.dir_exists === false) continue;
          toast('Не знайдено: /' + segs.join('/'), 4500);
          navigate(dirHref(dir), true);
          return;
        } catch (_) {}
      }
      navigate('/', true);
    }

    async function getJson(url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) {
        const err = new Error('HTTP ' + res.status);
        err.status = res.status;
        // 403 {"locked": "/folder"}: password-protected folder (see the proxy's vault.js)
        if (res.status === 403) { try { const j = await res.json(); if (j && j.locked) err.locked = j.locked; } catch (_) {} }
        throw err;
      }
      return res.json();
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
      }
      const ta = el('textarea', { readonly: '', style: 'position:fixed;top:0;left:0;opacity:0' });
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove();
      return ok;
    }
    async function copyLink(segs) {
      const ok = await copyText(location.origin + pathOf(segs));
      toast(ok ? 'Посилання скопійовано' : 'Не вдалося скопіювати');
    }

    /* ---------- file types ---------- */

      md: ['md', 'markdown', 'mdown'],

      text: ['txt', 'log', 'json', 'xml', 'yml', 'yaml', 'toml', 'ini', 'cfg', 'conf', 'env', 'properties',
             'sh', 'bash', 'ps1', 'bat', 'cmd', 'py', 'js', 'ts', 'css', 'html', 'htm', 'c', 'h', 'cpp', 'hpp',
             'cs', 'java', 'go', 'rs', 'lua', 'sql', 'srt', 'vtt', 'rst', 'tex'],   // others (e.g. .param) → «Показати як текст» on demand

      text: 'text', archive: 'archive', other: 'file', dir: 'folder', docx: 'text', xlsx: 'table', odt: 'text', ods: 'table', model: 'cube', legacy: 'file' };
    const TYPE_ORDER = { dir: 0, md: 1, docx: 2, odt: 2, pdf: 3, xlsx: 4, ods: 4, text: 5, csv: 6, image: 7, video: 8, audio: 9, archive: 10, model: 10, legacy: 11, other: 12 };
    const EXT_TYPE = {};
    for (const [t, list] of Object.entries(TYPES)) list.forEach(e => { EXT_TYPE[e] = t; });
    const typeOf = name => EXT_TYPE[extOf(name)] || 'other';
    const isTextual = t => t === 'text' || t === 'md' || t === 'csv';
    function typeIcon(t) {

    /* ---------- state ---------- */
    const S = {
      segs: [], mode: 'dir',
      user: '', canWrite: false, canDelete: false, searchAllowed: false,
      items: [], loadFailed: false, searchResults: null, searchSeq: 0,
      editor: null
    };

    function applyPerms(data) {
      S.user = data.user || '';
      S.canWrite = !!data.allow_upload;
      S.canDelete = !!data.allow_delete;
      S.searchAllowed = !!data.allow_search;
      S.archiveAllowed = !!data.allow_archive;
      document.body.classList.toggle('ro', !S.canWrite);
      document.body.classList.toggle('nodel', !S.canDelete);
      const who = $('who');
      const anon = !!data.auth && !S.user;
      $('login-btn').classList.toggle('hidden', !anon);
      who.classList.toggle('hidden', !S.user);
      if (S.user) {
        const role = $('role-icon');
        const label = S.canWrite ? 'Редагування' : 'Лише перегляд';
        role.innerHTML = iconHtml(S.canWrite ? 'edit' : 'visibility');
        role.title = label;
        role.setAttribute('aria-label', label);
        who.classList.toggle('rw', S.canWrite);
        who.classList.remove('hidden');
      }
      $('deep-wrap').classList.toggle('hidden', !S.searchAllowed);
    }

    /* ---------- disk ---------- */
    async function loadDisk() {
      const box = $('disk');
      try {
        const d = await getJson(DISK_URL);
        const total = Number(d.total);
        const free = d.free != null ? Number(d.free) : total - Number(d.used);
        if (!(total > 0) || !isFinite(free)) throw new Error('bad data');
        const pct = Math.min(100, Math.max(0, (total - free) / total * 100));
        const fill = el('div', { class: 'disk-fill' });
        box.replaceChildren(icon('storage'), el('div', { class: 'disk-bar' }, fill), el('span', { text: Math.round(pct) + '%' }));
        fill.style.width = pct + '%';
        box.classList.toggle('warn', pct >= 70 && pct < 90);
        box.classList.toggle('crit', pct >= 90);
        box.title = 'Вільно ' + formatSize(free) + ' з ' + formatSize(total);
        box.classList.remove('hidden');
        return true;
      } catch (_) {
        box.classList.add('hidden');
        return false;
      }
    }

    /* ---------- breadcrumbs ---------- */
    function renderCrumbs(segs, isFile) {
      const item = (iconNode, text, href, dropSegs) => href
        ? el('a', { href, 'data-spa': true, 'data-drop': JSON.stringify(dropSegs) }, iconNode, el('span', { text }))
        : el('span', { class: 'cur', 'aria-current': 'page' }, iconNode, el('span', { text }));
      const parts = [item(icon('home'), 'Головна', segs.length ? '/' : null, [])];
      segs.forEach((s, i) => {
        const last = i === segs.length - 1;
        const ic = last && isFile ? typeIcon(typeOf(s)) : icon('folder');
        parts.push(el('span', { class: 'sep' }, icon('chevron_right')));
        parts.push(item(ic, s, last ? null : dirHref(segs.slice(0, i + 1)), segs.slice(0, i + 1)));
      });
      $('crumbs').replaceChildren(...parts);
    }

    /* ---------- folder view ---------- */
    function sortItems(list) {
      const mode = $('sort').value;
      return list.slice().sort((a, b) => {
        const da = isDir(a), db = isDir(b);
        if (da !== db) return da ? -1 : 1;
        if (mode === 'mtime') return (b.mtime || 0) - (a.mtime || 0);
        if (mode === 'size' && !da) return (b.size || 0) - (a.size || 0);
        if (mode === 'type' && !da) {
          const d = TYPE_ORDER[typeOf(a.name)] - TYPE_ORDER[typeOf(b.name)];
          if (d) return d;
        }
        return collator.compare(a.name, b.name);
      });
    }

    function renderRow(p, baseSegs) {
      // p.name may contain "/" for recursive search results
      const rel = p.name.split('/').filter(Boolean);
      const segs = baseSegs.concat(rel);
      const name = rel[rel.length - 1] || p.name;
      const dir = isDir(p);
      const t = dir ? 'dir' : typeOf(name);
      const href = dir ? dirHref(segs) : viewHref(segs);
      const meta = dir ? formatDate(p.mtime) : [formatSize(p.size), formatDate(p.mtime)].filter(Boolean).join(' · ');

      const badge = !dir ? null
        : p.vault_hidden ? el('span', { class: 'row-badge hid', title: 'Прихована: бачить лише редактор' }, icon('visibility_off'))
        : p.vault_locked ? el('span', { class: 'row-badge', title: p.vault_open ? 'Захищена паролем (відкрито)' : 'Захищена паролем' }, icon(p.vault_open ? 'lock_open' : 'lock'))
        : null;
      const main = el('a', { class: 'row-main', href, 'data-spa': true },
        el('span', { class: 'row-name' }, document.createTextNode(name), badge),
        rel.length > 1 ? el('span', { class: 'row-path', text: rel.slice(0, -1).join(' / ') }) : null,
        el('span', { class: 'row-sub', text: meta })
      );
      const actions = el('div', { class: 'row-actions' });
      if (!dir) actions.append(linkBtn('download', 'Скачати', 'btn-ghost', pathOf(segs), { iconOnly: true, download: name }));
      else if (S.archiveAllowed && !(p.vault_locked && p.vault_open === false)) {
        const zip = linkBtn('archive', 'Скачати папку (ZIP)', 'btn-ghost', dirHref(segs) + '?zip', { iconOnly: true, download: name + '.zip' });
        if (!S.user) zip.addEventListener('click', e => checkZip(e, zip));   // readers: the proxy refuses folders with protected content
        actions.append(zip);
      }
      if (dir && S.canWrite) actions.append(button('shield', 'Доступ: для всіх / прихована / пароль', 'btn-ghost', () => editAccess(segs, p), { iconOnly: true }));
      if (S.canWrite && S.canDelete) actions.append(button('edit', 'Перейменувати / перемістити', 'btn-ghost', () => renameOrMove(segs, dir), { iconOnly: true }));
      if (S.canDelete) actions.append(button('delete', 'Видалити', 'btn-ghost', () => removePath(segs, dir), { iconOnly: true }));

      const row = el('div', { class: 'row' + (dir ? ' dir' : '') },
        el('span', { class: 't-icon' }, typeIcon(t)),
        main,
        el('span', { class: 'row-meta', text: meta }),
        actions
      );
      if (dir) row.dataset.drop = JSON.stringify(segs);
      if (S.canWrite && S.canDelete) {
        row.draggable = true;
        row.addEventListener('dragstart', e => {
          e.dataTransfer.setData(MOVE_TYPE, JSON.stringify({ segs, dir }));
          e.dataTransfer.effectAllowed = 'move';
          row.classList.add('dragging');
        });
        row.addEventListener('dragend', () => { row.classList.remove('dragging'); clearDrag(); });
      }
      return row;
    }

    function renderList() {
      const list = $('list');
      const q = $('search').value.trim().toLocaleLowerCase('uk');
      let items;
      if (S.loadFailed) {
        list.replaceChildren(el('div', { class: 'empty', text: 'Не вдалося завантажити вміст папки' }));
        return;
      }
      if (S.searchResults) items = S.searchResults;
      else items = S.items.filter(p => !q || p.name.toLocaleLowerCase('uk').includes(q));
      items = sortItems(items);
      if (!items.length) {
        list.replaceChildren(el('div', { class: 'empty',
          text: q ? 'Нічого не знайдено' : (S.canWrite ? 'Папка порожня. Перетягніть файли сюди, вставте їх (Ctrl+V) або натисніть «Завантажити».' : 'Папка порожня') }));
        return;
      }
      list.replaceChildren(...items.map(p => renderRow(p, S.segs)));
    }

    async function loadDir() {
      const segs = S.segs;
      S.searchResults = null;
      try {
        const data = await getJson(dirHref(segs) + '?json');
        if (S.mode !== 'dir' || S.segs !== segs) return;
        if (data.dir_exists === false && segs.length) return goNearestExisting(segs);
        applyPerms(data);
        S.items = (data.paths || []).filter(p => !p.name.startsWith('.'));
        S.loadFailed = false;
        markCurrentFolder(data.vault_self);
      } catch (e) {
        if (S.mode !== 'dir' || S.segs !== segs) return;
        if (e.locked) return showUnlock($('list'), e.locked, () => { if (S.mode === 'dir' && S.segs === segs) loadDir(); });
        if (/HTTP 404/.test(e.message) && segs.length) return goNearestExisting(segs);
        console.error(e);
        S.items = [];
        S.loadFailed = true;
      }
      if (S.searchAllowed && $('search').value.trim() && $('deep').checked) runDeepSearch();
      else renderList();
    }

    let searchTimer = null;
    function onSearchInput() {
      clearTimeout(searchTimer);
      if (S.searchAllowed && $('deep').checked && $('search').value.trim()) {
        searchTimer = setTimeout(runDeepSearch, 300);
      } else {
        S.searchResults = null;
        renderList();
      }
    }
    async function runDeepSearch() {
      const q = $('search').value.trim();
      if (!q) { S.searchResults = null; renderList(); return; }
      const seq = ++S.searchSeq;
      const segs = S.segs;
      try {
        const data = await getJson(dirHref(segs) + '?q=' + encodeURIComponent(q) + '&json');
        if (seq !== S.searchSeq || S.segs !== segs) return;
        S.searchResults = (data.paths || []).filter(p => !p.name.split('/').some(s => s.startsWith('.')));
      } catch (e) {
        if (seq !== S.searchSeq) return;
        S.searchResults = null;
        toast('Пошук не вдався');
      }
      renderList();
    }

    function showDir() {
      document.title = (S.segs.length ? S.segs[S.segs.length - 1] + ' — ' : '') + 'Документація';
      renderCrumbs(S.segs, false);
      $('list').replaceChildren(el('div', { class: 'empty', text: 'Завантаження…' }));
      loadDir();
    }

    /* ---------- hidden / password-protected folders ---------- */
    // A folder's access is the marker file ".vault" inside it; the proxy (vault.js) enforces it.
    //   {"hidden":true}  → only the editor sees it;  {"salt","hash"} → readers need the password
    const VAULT_LOCK_URL = '/__vault/lock', VAULT_UNLOCK_URL = '/__vault/unlock';

    function showUnlock(box, dir, done) {
      const name = dir.split('/').filter(Boolean).pop() || dir;
      const input = el('input', { class: 'txt-in', type: 'password', autocomplete: 'current-password', placeholder: 'Пароль', 'aria-label': 'Пароль' });
      const msg = el('div', { class: 'unlock-msg', role: 'alert' });
      const go = button('lock_open', 'Відкрити', 'btn-primary', null);
      go.type = 'submit';
      const form = el('form', { class: 'unlock-form', onsubmit: async e => {
        e.preventDefault();
        if (!input.value) { input.focus(); return; }
        go.disabled = true;
        msg.textContent = '';
        try {
          const r = await fetch(VAULT_UNLOCK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: dir, password: input.value }) });
          if (r.ok) { done(); return; }
          msg.textContent = r.status === 429 ? 'Забагато спроб. Зачекайте хвилину.'
            : r.status === 403 ? 'Невірний пароль' : 'Не вдалося відкрити (статус ' + r.status + ')';
        } catch (_) { msg.textContent = 'Немає з’єднання з сервером'; }
        go.disabled = false;
        input.select();
      } }, input, go);
      box.replaceChildren(el('div', { class: 'unlock' },
        icon('lock'),
        el('h2', { text: 'Папка «' + name + '» захищена паролем' }),
        el('p', { text: 'Введіть пароль, щоб переглянути вміст.' }),
        form, msg));
      input.focus();
    }

    // badge on the current folder in the path bar
    function markCurrentFolder(self) {
      const cur = document.querySelector('#crumbs .cur');
      if (!cur || !self || !S.segs.length) return;
      if (self.hidden) cur.append(el('span', { class: 'row-badge hid', title: 'Прихована: бачить лише редактор' }, icon('visibility_off')));
      else if (self.locked && S.user) cur.append(el('span', { class: 'row-badge', title: 'Захищена паролем' }, icon('lock')));
      else if (self.locked) {
        // reader inside an unlocked folder: click = forget the passwords on this device
        cur.append(el('button', { class: 'row-badge', type: 'button', title: 'Відкрито паролем. Натисніть, щоб знову закрити на цьому пристрої',
          onclick: async () => {
            if (!confirm('Закрити захищені папки на цьому пристрої? Для перегляду знову знадобиться пароль.')) return;
            await fetch(VAULT_LOCK_URL, { method: 'POST' }).catch(() => null);
            loadDir();
          } }, icon('lock_open')));
      }
    }

    async function checkZip(e, a) {
      e.preventDefault();
      const r = await fetch(a.href, { method: 'HEAD', cache: 'no-store' }).catch(() => null);
      if (r && r.ok) { location.href = a.href; return; }
      toast(r && r.status === 403 ? 'Архів недоступний: у папці є захищений вміст' : 'Не вдалося скачати архів', 4000);
    }

    // SHA-256 hex (crypto.subtle only exists on https/localhost; plain-JS fallback for http on the LAN)
    async function sha256Hex(str) {
      const bytes = new TextEncoder().encode(str);
      if (window.crypto && crypto.subtle && window.isSecureContext) {
        const buf = await crypto.subtle.digest('SHA-256', bytes);
        return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
      }
      return sha256Js(bytes);
    }
    function sha256Js(bytes) {
      const primes = [];
      for (let n = 2; primes.length < 64; n++) if (primes.every(p => n % p)) primes.push(n);
      const frac = x => (x - Math.floor(x)) * 4294967296 >>> 0;
      const K = primes.map(p => frac(Math.cbrt(p)));
      const H = primes.slice(0, 8).map(p => frac(Math.sqrt(p)));
      const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
      const m = new Uint8Array(total);
      m.set(bytes);
      m[len] = 0x80;
      const bits = len * 8;
      const dv = new DataView(m.buffer);
      dv.setUint32(total - 8, Math.floor(bits / 4294967296));
      dv.setUint32(total - 4, bits >>> 0);
      const w = new Uint32Array(64);
      const rot = (x, n) => (x >>> n) | (x << (32 - n));
      for (let off = 0; off < total; off += 64) {
        for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
        for (let i = 16; i < 64; i++) {
          const s0 = rot(w[i - 15], 7) ^ rot(w[i - 15], 18) ^ (w[i - 15] >>> 3);
          const s1 = rot(w[i - 2], 17) ^ rot(w[i - 2], 19) ^ (w[i - 2] >>> 10);
          w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
        }
        let [a, b, c, d, e, f, g, h] = H;
        for (let i = 0; i < 64; i++) {
          const t1 = (h + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
          const t2 = ((rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
          h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
        }
        [a, b, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) >>> 0; });
      }
      return H.map(v => v.toString(16).padStart(8, '0')).join('');
    }
    const randomHex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');

    function editAccess(segs, p) {
      const name = segs[segs.length - 1];
      const cur = p.vault_hidden ? 'hidden' : p.vault_locked ? 'password' : 'open';
      const back = el('div', { class: 'modal-back' });
      const close = () => { document.removeEventListener('keydown', onKey, true); back.remove(); };
      const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
      const opt = (val, ic, title, desc) => el('label', {},
        el('input', { type: 'radio', name: 'acc', value: val, checked: val === cur, onchange: sync }),
        icon(ic), el('span', {}, el('b', { text: title }), el('small', { text: desc })));
      const pw = el('input', { class: 'txt-in', type: 'text', autocomplete: 'off', spellcheck: 'false', 'aria-label': 'Пароль',
        placeholder: cur === 'password' ? 'Новий пароль (порожньо — залишити поточний)' : 'Пароль для читачів' });
      const pwBox = el('div', { class: 'acc-pw' }, pw);
      const err = el('div', { class: 'acc-err', role: 'alert' });
      function sync() {
        const v = back.querySelector('input[name=acc]:checked').value;
        pwBox.classList.toggle('hidden', v !== 'password');
        if (v === 'password') pw.focus();
      }
      const save = async () => {
        const v = back.querySelector('input[name=acc]:checked').value;
        const url = pathOf(segs.concat('.vault'));
        let res;
        err.textContent = '';
        if (v === 'open') {
          if (cur === 'open') return close();
          res = await fetch(url, { method: 'DELETE' }).catch(() => null);
          if (res && res.status === 404) res = { ok: true };
        } else if (v === 'hidden') {
          res = await fetch(url, { method: 'PUT', body: JSON.stringify({ hidden: true }) + '\n' }).catch(() => null);
        } else {
          const pass = pw.value;
          if (!pass && cur === 'password') return close();
          if (pass.length < 4) { err.textContent = 'Пароль — щонайменше 4 символи'; pw.focus(); return; }
          const salt = randomHex(16);
          res = await fetch(url, { method: 'PUT', body: JSON.stringify({ salt, hash: await sha256Hex(salt + pass) }) + '\n' }).catch(() => null);
        }
        if (!res || !res.ok) { err.textContent = 'Не вдалося зберегти' + (res && res.status ? ' (статус ' + res.status + ')' : ''); return; }
        close();
        toast(v === 'open' ? 'Папка відкрита для всіх' : v === 'hidden' ? 'Папку приховано від читачів' : 'Пароль встановлено');
        if (S.mode === 'dir') loadDir();
      };
      const box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'acc-h' },
        el('h2', { id: 'acc-h', text: 'Доступ до папки «' + name + '»' }),
        el('div', { class: 'acc-opts' },
          opt('open', 'visibility', 'Для всіх', 'Читачі бачать і відкривають папку без входу.'),
          opt('hidden', 'visibility_off', 'Прихована', 'Бачить лише редактор. Для читачів папки не існує.'),
          opt('password', 'lock', 'З паролем', 'Читачі бачать папку, але відкривають її лише після введення пароля.')),
        pwBox, err,
        el('p', { text: 'Діє на всі вкладені папки й файли. Налаштування переїжджає разом з папкою при перейменуванні.' }),
        el('div', { class: 'choices' },
          button('save', 'Зберегти', 'btn-primary', save),
          button('close', 'Скасувати', 'btn-soft', close)));
      back.append(box);
      back.addEventListener('click', e => { if (e.target === back) close(); });
      pw.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
      document.addEventListener('keydown', onKey, true);
