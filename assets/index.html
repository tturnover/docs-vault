    /* ---------- create / rename / delete ---------- */
    async function makeFolder() {
      const name = (prompt('Назва нової папки:') || '').trim();
      if (!name) return;
      if (badName(name)) { alert('Назва не може містити / або \\'); return; }
      const res = await fetch(pathOf(S.segs.concat(name)), { method: 'MKCOL' }).catch(() => null);
      if (res && res.ok) { toast('Папку створено'); loadDir(); }
      else alert('Не вдалося створити папку (можливо, вже існує)');
    }

    async function exists(segs) {
      const res = await fetch(pathOf(segs), { method: 'HEAD', cache: 'no-store' }).catch(() => null);
      return !!(res && res.ok);
    }

    async function newNote() {
      let name = (prompt('Назва нового файлу (.md — розмітка, .txt — простий текст):', 'нотатка.md') || '').trim();
      if (!name) return;
      if (badName(name)) { alert('Назва не може містити / або \\'); return; }
      if (!extOf(name)) name += '.md';
      const segs = S.segs.concat(name);
      if (await exists(segs)) { alert('Файл з такою назвою вже існує'); return; }
      const body = extOf(name) === 'md' ? '# ' + name.replace(/\.[^.]+$/, '') + '\n\n' : '';
      const res = await fetch(pathOf(segs), { method: 'PUT', body }).catch(() => null);
      if (res && res.ok) navigate(editHref(segs));
      else alert('Не вдалося створити файл');
    }

    async function renameOrMove(segs, dir) {
      const oldRel = segs.join('/');
      const input = prompt('Нова назва або шлях від кореня (наприклад «Інструкції/Монтаж/файл.pdf»):', oldRel);
      if (input == null) return;
      const newSegs = input.split('/').map(s => s.trim()).filter(Boolean);
      if (!newSegs.length || newSegs.some(s => s === '.' || s === '..' || s.includes('\\'))) { alert('Некоректний шлях'); return; }
      if (newSegs.join('/') === oldRel) return;
      if (dir && newSegs.join('/').startsWith(oldRel + '/')) { alert('Не можна перемістити папку всередину себе'); return; }
      if (await exists(newSegs)) { alert('За цим шляхом уже щось є'); return; }
      // ensure parent folders exist
      for (let i = 1; i < newSegs.length; i++) {
        const parent = newSegs.slice(0, i);
        if (!(await exists(parent))) {
          const r = await fetch(pathOf(parent), { method: 'MKCOL' }).catch(() => null);
          if (!r || !r.ok) { alert('Не вдалося створити папку ' + parent.join('/')); return; }
        }
      }
      const res = await fetch(pathOf(segs), { method: 'MOVE', headers: { 'Destination': location.origin + pathOf(newSegs) } }).catch(() => null);
      if (!res || !res.ok) { alert('Не вдалося перейменувати' + (res ? ' (статус ' + res.status + ')' : '')); return; }
      toast('Готово');
      if (S.mode === 'dir') {
        // renamed the folder we're in (or a parent)? go to new location
        const cur = S.segs.join('/');
        if (dir && (cur === oldRel || cur.startsWith(oldRel + '/'))) {
          navigate(dirHref(newSegs.concat(S.segs.slice(segs.length))), true);
        } else loadDir();
      } else {
        navigate(dir ? dirHref(newSegs) : viewHref(newSegs), true);
      }
    }

    async function removePath(segs, dir) {
      const name = segs[segs.length - 1];
      const msg = dir ? 'Видалити папку «' + name + '» разом з усім вмістом?' : 'Видалити файл «' + name + '»?';
      if (!confirm(msg)) return;
      const res = await fetch(pathOf(segs) + (dir ? '/' : ''), { method: 'DELETE' }).catch(() => null);
      if (!res || !res.ok) { alert('Не вдалося видалити' + (res ? ' (статус ' + res.status + ')' : '')); return; }
      toast('Видалено');
      loadDisk();
      if (S.mode === 'dir') {
        const cur = S.segs.join('/'), rel = segs.join('/');
        if (dir && (cur === rel || cur.startsWith(rel + '/'))) navigate(dirHref(segs.slice(0, -1)), true);
        else loadDir();
      } else {
        navigate(dirHref(segs.slice(0, -1)), true);
      }
    }

    /* ---------- markdown ---------- */
    function safeUrl(u) {
      const s = u.replace(/&amp;/g, '&').trim();
      if (/^(javascript|vbscript|data):/i.test(s.replace(/[\s\u0000-\u001f]/g, ''))) return '#';
      return escapeHtml(s);
    }
    function mdInline(text) {
      const codes = [];
      let s = text.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
      s = escapeHtml(s);
      s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (_, alt, u) => '<img alt="' + alt + '" src="' + safeUrl(u) + '" loading="lazy">');
      s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (_, t, u) => '<a href="' + safeUrl(u) + '">' + t + '</a>');
      s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]*[^\s<).,;:!?])/g, (_, pre, u) => pre + '<a href="' + safeUrl(u) + '" target="_blank" rel="noopener">' + u + '</a>');
      s = s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>').replace(/__(?=\S)([\s\S]*?\S)__/g, '<strong>$1</strong>');
      s = s.replace(/(^|[^*\w])\*(?=\S)([^*]*?\S)\*(?!\*)/g, '$1<em>$2</em>').replace(/(^|[^_\w])_(?=\S)([^_]*?\S)_(?![_\w])/g, '$1<em>$2</em>');
      s = s.replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>');
      s = s.replace(/ {2,}\n|\\\n/g, '<br>');
      return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + escapeHtml(codes[i]) + '</code>');
    }
    function splitRow(line) {
      let l = line.trim();
      if (l.startsWith('|')) l = l.slice(1);
      if (l.endsWith('|') && !l.endsWith('\\|')) l = l.slice(0, -1);
      const cells = [];
      let cur = '';
      for (let k = 0; k < l.length; k++) {
        if (l[k] === '\\' && l[k + 1] === '|') { cur += '|'; k++; }
        else if (l[k] === '|') { cells.push(cur.trim()); cur = ''; }
        else cur += l[k];
      }
      cells.push(cur.trim());
      return cells;
    }
    const RE_LIST = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
    const RE_HR = /^\s{0,3}([-*_])(\s*\1){2,}\s*$/;
    const RE_TSEP = /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?\s*$/;
    function md(src) {
      const lines = src.replace(/\r\n?/g, '\n').split('\n');
      const out = [];
      let i = 0;
      const isBlockStart = (l, next) => /^\s*```|^\s*~~~/.test(l) || /^#{1,6}\s/.test(l) || /^\s*>/.test(l)
        || RE_LIST.test(l) || RE_HR.test(l) || (l.includes('|') && next != null && RE_TSEP.test(next));
      while (i < lines.length) {
        const line = lines[i];
        if (!line.trim()) { i++; continue; }
        let m;
        if ((m = line.match(/^\s*(```|~~~)\s*([\w+-]*)/))) {
          const fence = m[1], buf = [];
          i++;
          while (i < lines.length && !lines[i].trim().startsWith(fence)) buf.push(lines[i++]);
          i++;
          out.push('<pre><code>' + escapeHtml(buf.join('\n')) + '</code></pre>');
          continue;
        }
        if ((m = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) {
          const n = m[1].length;
          out.push('<h' + n + '>' + mdInline(m[2]) + '</h' + n + '>');
          i++; continue;
        }
        if (RE_HR.test(line)) { out.push('<hr>'); i++; continue; }
        if (/^\s*>/.test(line)) {
          const buf = [];
          while (i < lines.length && lines[i].trim() && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
          out.push('<blockquote>' + md(buf.join('\n')) + '</blockquote>');
          continue;
        }
        if (line.includes('|') && i + 1 < lines.length && RE_TSEP.test(lines[i + 1])) {
          const head = splitRow(line);
          const aligns = splitRow(lines[i + 1]).map(c => /^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : '');
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim() && lines[i].includes('|')) rows.push(splitRow(lines[i++]));
          const cell = (tag, c, j) => '<' + tag + (aligns[j] ? ' style="text-align:' + aligns[j] + '"' : '') + '>' + mdInline(c || '') + '</' + tag + '>';
          out.push('<div class="tbl"><table><thead><tr>' + head.map((c, j) => cell('th', c, j)).join('') + '</tr></thead><tbody>'
            + rows.map(r => '<tr>' + head.map((_, j) => cell('td', r[j], j)).join('') + '</tr>').join('') + '</tbody></table></div>');
          continue;
        }
        if (RE_LIST.test(line)) {
          // nested lists by indentation
          const stack = [];
          let html = '';
          while (i < lines.length) {
            const l = lines[i];
            const lm = l.match(RE_LIST);
            if (!lm) {
              if (l.trim() && /^\s{2,}/.test(l) && stack.length) { html += ' ' + mdInline(l.trim()); i++; continue; }
              break;
            }
            const indent = lm[1].replace(/\t/g, '    ').length;
            const ordered = /\d/.test(lm[2]);
            while (stack.length && indent < stack[stack.length - 1].indent) { html += '</li></' + stack.pop().tag + '>'; }
            // same level but list type changed (bullets -> numbers): start a new list
            if (stack.length && indent === stack[stack.length - 1].indent && stack[stack.length - 1].tag !== (ordered ? 'ol' : 'ul')) {
              html += '</li></' + stack.pop().tag + '>';
            }
            const top = stack[stack.length - 1];
            if (!top || indent > top.indent) {
              const tag = ordered ? 'ol' : 'ul';
              stack.push({ indent, tag });
              html += '<' + tag + (ordered && parseInt(lm[2], 10) !== 1 ? ' start="' + parseInt(lm[2], 10) + '"' : '') + '>';
            } else {
              html += '</li>';
            }
            let body = lm[3];
            const task = body.match(/^\[([ xX])\]\s+(.*)$/);
            if (task) html += '<li class="task"><input type="checkbox" disabled' + (task[1] !== ' ' ? ' checked' : '') + '>' + mdInline(task[2]);
            else html += '<li>' + mdInline(body);
            i++;
          }
          while (stack.length) html += '</li></' + stack.pop().tag + '>';
          out.push(html);
          continue;
        }
        const buf = [];
        while (i < lines.length && lines[i].trim() && !(buf.length && isBlockStart(lines[i], lines[i + 1]))) buf.push(lines[i++]);
        out.push('<p>' + mdInline(buf.join('\n')) + '</p>');
      }
      return out.join('\n');
    }

    /* ---------- csv ---------- */
    function parseCsv(text, delim) {
      const rows = [];
      let row = [], field = '', q = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) {
          if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
          else field += c;
        } else if (c === '"' && field === '') q = true;
        else if (c === delim) { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(field); rows.push(row); row = []; field = '';
          if (rows.length > CSV_MAX_ROWS) break;
        } else field += c;
      }
      if (field || row.length) { row.push(field); rows.push(row); }
      return rows;
    }
    function detectDelim(text, ext) {
      if (ext === 'tsv') return '\t';
      const first = text.split('\n', 1)[0];
      const counts = [';', ',', '\t'].map(d => [d, first.split(d).length]);
      counts.sort((a, b) => b[1] - a[1]);
      return counts[0][1] > 1 ? counts[0][0] : ',';
    }

    /* ---------- office: docx / xlsx (built-in reader, no external libraries) ---------- */
    // .docx / .xlsx are ZIP archives of XML. Unzip with the browser's DecompressionStream,
    // parse XML with DOMParser, build DOM nodes (never innerHTML from document content).
    const OFFICE_MAX = 50 * 1024 * 1024;
    const XL_MAX_ROWS = 2000, XL_MAX_COLS = 100;
    let blobUrls = [];
    function revokeBlobs() { blobUrls.forEach(u => URL.revokeObjectURL(u)); blobUrls = []; }

    async function unzip(buf) {
      if (typeof DecompressionStream === 'undefined') throw new Error('браузер застарий для перегляду документів');
      const dv = new DataView(buf), u8 = new Uint8Array(buf);
      let eocd = -1;
      for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) {
        if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      }
      if (eocd < 0) throw new Error('файл пошкоджений або це не формат Office 2007+');
      const count = dv.getUint16(eocd + 10, true);
      let p = dv.getUint32(eocd + 16, true);
      const entries = new Map(), dec = new TextDecoder();
      for (let k = 0; k < count && dv.getUint32(p, true) === 0x02014b50; k++) {
        const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
        entries.set(dec.decode(u8.subarray(p + 46, p + 46 + nlen)),
          { method: dv.getUint16(p + 10, true), csize: dv.getUint32(p + 20, true), lho: dv.getUint32(p + 42, true) });
        p += 46 + nlen + xlen + clen;
      }
      const zip = {
        async bytes(name) {
          const e = entries.get(name);
          if (!e) return null;
          const start = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true);
          const data = u8.subarray(start, start + e.csize);
          if (e.method === 0) return data.slice();
          if (e.method !== 8) throw new Error('непідтримуване стиснення');
          const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
          return new Uint8Array(out);
        },
        async xml(name) {
          const b = await zip.bytes(name);
          if (!b) return null;
          const x = new DOMParser().parseFromString(new TextDecoder().decode(b), 'application/xml');
          if (x.getElementsByTagName('parsererror').length) throw new Error('пошкоджений XML: ' + name);
          return x;
        }
      };
      return zip;
    }

    // namespace-agnostic XML helpers (match by local name)
    const xKids = (n, name) => n ? Array.from(n.children).filter(c => c.localName === name) : [];
    const xKid = (n, name) => n ? Array.from(n.children).find(c => c.localName === name) || null : null;
    const xDesc = (n, name) => n ? Array.from(n.getElementsByTagNameNS('*', name)) : [];
    function xAttr(n, name) {
      if (!n) return null;
      for (const a of n.attributes) if (a.localName === name) return a.value;
      return null;
    }
    function zipPath(base, target) {
      if (target.startsWith('/')) return target.slice(1);
      const parts = base ? base.split('/') : [];
      for (const s of target.split('/')) { if (s === '..') parts.pop(); else if (s && s !== '.') parts.push(s); }
      return parts.join('/');
    }
    function readRels(xml, base) {
      const m = new Map();
      if (!xml) return m;
      for (const r of xDesc(xml.documentElement, 'Relationship')) {
        const ext = r.getAttribute('TargetMode') === 'External';
        const t = r.getAttribute('Target') || '';
        m.set(r.getAttribute('Id'), { external: ext, target: ext ? t : zipPath(base, t) });
      }
      return m;
    }
    const IMG_MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', bmp: 'image/bmp',
      webp: 'image/webp', svg: 'image/svg+xml', tif: 'image/tiff', tiff: 'image/tiff' };

    /* --- docx --- */
    async function buildDocx(buf) {
      const zip = await unzip(buf);
      const doc = await zip.xml('word/document.xml');
      if (!doc) throw new Error('це не документ Word');
      const rels = readRels(await zip.xml('word/_rels/document.xml.rels'), 'word');

      const styles = new Map();
      const sx = await zip.xml('word/styles.xml');
      if (sx) for (const s of xDesc(sx.documentElement, 'style')) {
        styles.set(xAttr(s, 'styleId'), { name: (xAttr(xKid(s, 'name'), 'val') || '').toLowerCase(), based: xAttr(xKid(s, 'basedOn'), 'val') });
      }
      function headingLevel(id) {
        for (let k = 0, cur = id; cur && k < 6; k++) {
          const s = styles.get(cur);
          const m = /^heading\s*(\d)/i.exec(s ? s.name : cur);
          if (m) return +m[1];
          if (s && s.name === 'title') return 1;
          if (s && s.name === 'subtitle') return 2;
          cur = s && s.based;
        }
        return 0;
      }

      const numFmt = new Map();   // numId -> { ilvl: 'bullet' | 'decimal' | ... }
      const nx = await zip.xml('word/numbering.xml');
      if (nx) {
        const abs = new Map();
        for (const a of xKids(nx.documentElement, 'abstractNum')) {
          const lv = {};
          for (const l of xKids(a, 'lvl')) lv[xAttr(l, 'ilvl')] = xAttr(xKid(l, 'numFmt'), 'val');
          abs.set(xAttr(a, 'abstractNumId'), lv);
        }
        for (const n of xKids(nx.documentElement, 'num')) numFmt.set(xAttr(n, 'numId'), abs.get(xAttr(xKid(n, 'abstractNumId'), 'val')) || {});
      }

      const pending = [];
      const on = (rPr, name) => {
        const e = xKid(rPr, name);
        if (!e) return false;
        const v = xAttr(e, 'val');
        return v == null || !/^(0|false|off|none)$/i.test(v);
      };

      function image(id, holder) {
        const r = id && rels.get(id);
        if (!r || r.external) return null;
        const ext = extOf(r.target), mime = IMG_MIME[ext];
        if (!mime) return el('span', { class: 'docx-noimg', text: '[зображення ' + ext.toUpperCase() + ']' });
        const img = el('img', { alt: '' });
        const extent = xDesc(holder, 'extent')[0];
        const cx = extent && Number(extent.getAttribute('cx'));
        if (cx) img.style.width = Math.round(cx / 9525) + 'px';
        pending.push(zip.bytes(r.target).then(b => {
          if (!b) return;
          const u = URL.createObjectURL(new Blob([b], { type: mime }));
          blobUrls.push(u);
          img.src = u;
        }).catch(() => {}));
        return img;
      }

      function run(r) {
        const rPr = xKid(r, 'rPr'), nodes = [];
        let text = '';
        const flush = () => { if (text) { nodes.push(document.createTextNode(text)); text = ''; } };
        for (const c of r.children) {
          switch (c.localName) {
            case 't': text += c.textContent; break;
            case 'tab': text += '\t'; break;
            case 'noBreakHyphen': text += '‑'; break;
            case 'br': case 'cr': flush(); nodes.push(xAttr(c, 'type') === 'page' ? el('hr', { class: 'pb' }) : el('br')); break;
            case 'drawing': case 'pict': case 'object':
              flush();
              for (const b of xDesc(c, 'blip').concat(xDesc(c, 'imagedata'))) {
                const img = image(xAttr(b, 'embed') || xAttr(b, 'id'), c);
                if (img) nodes.push(img);
              }
              break;
          }
        }
        flush();
        if (!nodes.length) return [];
        const tags = [];
        if (on(rPr, 'b')) tags.push('strong');
        if (on(rPr, 'i')) tags.push('em');
        if (on(rPr, 'u')) tags.push('u');
        if (on(rPr, 'strike') || on(rPr, 'dstrike')) tags.push('s');
        const va = xAttr(xKid(rPr, 'vertAlign'), 'val');
        if (va === 'superscript') tags.push('sup'); else if (va === 'subscript') tags.push('sub');
        if (!tags.length) return nodes;
        const outer = el(tags[0]);
        let inner = outer;
        for (const t of tags.slice(1)) { const e = el(t); inner.append(e); inner = e; }
        inner.append(...nodes);
        return [outer];
      }

      function inline(node, out) {
        for (const c of node.children) {
          switch (c.localName) {
            case 'r': out.append(...run(c)); break;
            case 'hyperlink': {
              const r = rels.get(xAttr(c, 'id'));
              if (r && r.external && /^(https?:|mailto:)/i.test(r.target)) {
                const a = el('a', { href: r.target, target: '_blank', rel: 'noopener' });
                inline(c, a);
                out.append(a);
              } else inline(c, out);
              break;
            }
            case 'ins': case 'smartTag': case 'sdt': case 'sdtContent': case 'customXml': case 'fldSimple':
              inline(c, out); break;
          }
        }
      }

      function table(tbl) {
        const t = el('table');
        for (const tr of xKids(tbl, 'tr')) {
          const row = el('tr');
          for (const tc of xKids(tr, 'tc')) {
            const tcPr = xKid(tc, 'tcPr');
            const span = Number(xAttr(xKid(tcPr, 'gridSpan'), 'val')) || 1;
            const vm = xKid(tcPr, 'vMerge');
            const td = el('td', { colspan: span > 1 ? span : null });
            if (vm && xAttr(vm, 'val') !== 'restart') td.className = 'vm';   // continuation of a vertically merged cell
            else blocks(tc, td);
            row.append(td);
          }
          t.append(row);
        }
        return el('div', { class: 'tbl' }, t);
      }

      function blocks(node, out) {
        let list = null;
        for (const c of node.children) {
          const n = c.localName;
          if (n === 'p') {
            const pPr = xKid(c, 'pPr'), numPr = xKid(pPr, 'numPr');
            const numId = xAttr(xKid(numPr, 'numId'), 'val');
            if (numPr && numId && numId !== '0') {
              const ilvl = Number(xAttr(xKid(numPr, 'ilvl'), 'val')) || 0;
              const fmt = (numFmt.get(numId) || {})[ilvl] || 'bullet';
              const tag = fmt === 'bullet' ? 'ul' : 'ol';
              if (!list || list.numId !== numId || list.tag !== tag) { list = { numId, tag, el: el(tag) }; out.append(list.el); }
              const li = el('li');
              if (ilvl) li.style.marginLeft = (ilvl * 1.5) + 'em';
              if (tag === 'ol' && /letter/i.test(fmt)) li.style.listStyleType = /upper/i.test(fmt) ? 'upper-alpha' : 'lower-alpha';
              if (tag === 'ol' && /roman/i.test(fmt)) li.style.listStyleType = /upper/i.test(fmt) ? 'upper-roman' : 'lower-roman';
              inline(c, li);
              list.el.append(li);
              continue;
            }
            list = null;
            const lvl = headingLevel(xAttr(xKid(pPr, 'pStyle'), 'val'));
            const p = el(lvl ? 'h' + Math.min(lvl, 6) : 'p');
            const jc = xAttr(xKid(pPr, 'jc'), 'val');
            if (jc === 'center' || jc === 'right') p.style.textAlign = jc;
            else if (jc === 'both' || jc === 'distribute') p.style.textAlign = 'justify';
            inline(c, p);
            if (!p.childNodes.length) p.append(el('br'));   // empty paragraph = vertical spacing in Word
            out.append(p);
          } else if (n === 'tbl') { list = null; out.append(table(c)); }
          else if (n === 'sdt') { list = null; blocks(xKid(c, 'sdtContent') || c, out); }
          else if (n === 'customXml' || n === 'ins') blocks(c, out);
        }
      }

      const page = el('div', { class: 'docx-page' });
      blocks(xKid(doc.documentElement, 'body'), page);
      await Promise.all(pending);
      return page;
    }

    /* --- xlsx --- */
    const colIndex = ref => { let n = 0; for (const ch of ref.toUpperCase()) { const c = ch.charCodeAt(0); if (c < 65 || c > 90) break; n = n * 26 + c - 64; } return n; };
    const rowIndex = ref => Number((/\d+/.exec(ref) || ['0'])[0]);
    const colName = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };

    function numFmtKind(id, code) {
      if (code == null) {
        if (id === 22) return 'datetime';
        if ((id >= 14 && id <= 17) || (id >= 27 && id <= 36) || (id >= 50 && id <= 58)) return 'date';
        if ((id >= 18 && id <= 21) || (id >= 45 && id <= 47)) return 'time';
        if (id === 9 || id === 10) return 'pct';
        return '';
      }
      const c = code.split(';')[0].replace(/"[^"]*"|\[[^\]]*\]|\\./g, '');
      if (/%/.test(c)) return 'pct';
      const d = /[dy]/i.test(c), t = /[hs]/i.test(c);
      return d && t ? 'datetime' : d ? 'date' : t ? 'time' : '';
    }
    const fmtNum = n => (+n.toPrecision(15)).toLocaleString('uk-UA', { maximumFractionDigits: 10 });

    // shared spreadsheet rendering (xlsx + ods): grid = Map('r:c' -> { text, num }), merges = [{ r1, c1, r2, c2 }]
    function gridView(grid, merges, maxR, maxC, truncated) {
      if (!maxR) return el('div', { class: 'empty', text: 'Аркуш порожній' });
      const spans = new Map(), covered = new Set();
      for (const m of merges) {
        const r2 = Math.min(m.r2, maxR), c2 = Math.min(m.c2, maxC);
        if (m.r1 > maxR || m.c1 > maxC || r2 < m.r1 || c2 < m.c1) continue;
        spans.set(m.r1 + ':' + m.c1, { rs: r2 - m.r1 + 1, cs: c2 - m.c1 + 1 });
        for (let i = m.r1; i <= r2; i++) for (let j = m.c1; j <= c2; j++) if (i !== m.r1 || j !== m.c1) covered.add(i + ':' + j);
      }
      const head = el('tr', {}, el('th', { class: 'col', text: '' }));
      for (let j = 1; j <= maxC; j++) head.append(el('th', { class: 'col', text: colName(j) }));
      const body = el('tbody');
      for (let i = 1; i <= maxR; i++) {
        const tr = el('tr', {}, el('td', { class: 'n', text: String(i) }));
        for (let j = 1; j <= maxC; j++) {
          const key = i + ':' + j;
          if (covered.has(key)) continue;
          const v = grid.get(key), sp = spans.get(key);
          tr.append(el('td', { class: v && v.num ? 'num' : null, rowspan: sp && sp.rs > 1 ? sp.rs : null,
            colspan: sp && sp.cs > 1 ? sp.cs : null, text: v ? v.text : '' }));
        }
        body.append(tr);
      }
      const box = el('div', { class: 'csv xl' }, el('table', {}, el('thead', {}, head), body));
      if (!truncated) return box;
      return el('div', {}, box, el('p', { class: 'note', style: 'padding:0 12px 10px',
        text: 'Показано перші ' + XL_MAX_ROWS + ' рядків і ' + XL_MAX_COLS + ' стовпців. Повністю — у скачаному файлі.' }));
    }

    async function sheetTabs(sheets, viewOf) {
      if (!sheets.length) throw new Error('у книзі немає аркушів');
      const holder = el('div');
      const tabs = el('div', { class: 'sheet-tabs', role: 'tablist' });
      const show = async i => {
        tabs.querySelectorAll('button').forEach((b, k) => { b.classList.toggle('on', k === i); b.setAttribute('aria-selected', String(k === i)); });
        holder.replaceChildren(el('div', { class: 'empty', text: 'Завантаження…' }));
        try { holder.replaceChildren(await viewOf(sheets[i])); }
        catch (e) { holder.replaceChildren(el('div', { class: 'empty', text: 'Не вдалося прочитати аркуш: ' + e.message })); }
      };
      sheets.forEach((sh, i) => tabs.append(el('button', { type: 'button', role: 'tab', text: sh.name, onclick: () => show(i) })));
      await show(0);
      return sheets.length > 1 ? el('div', {}, tabs, holder) : holder;
    }

    async function buildXlsx(buf) {
      const zip = await unzip(buf);
      const wb = await zip.xml('xl/workbook.xml');
      if (!wb) throw new Error('це не книга Excel');
      const rels = readRels(await zip.xml('xl/_rels/workbook.xml.rels'), 'xl');
      const d1904 = xAttr(xDesc(wb.documentElement, 'workbookPr')[0], 'date1904');
      const is1904 = d1904 === '1' || d1904 === 'true';

      const shared = [];
      const ss = await zip.xml('xl/sharedStrings.xml');
      if (ss) for (const si of xKids(ss.documentElement, 'si')) {
        shared.push(xDesc(si, 't').filter(t => t.parentNode.localName !== 'rPh').map(t => t.textContent).join(''));
      }

      const kinds = [];
      const sx = await zip.xml('xl/styles.xml');
      if (sx) {
        const custom = new Map();
        for (const nf of xDesc(sx.documentElement, 'numFmt')) custom.set(xAttr(nf, 'numFmtId'), xAttr(nf, 'formatCode') || '');
        for (const xf of xKids(xDesc(sx.documentElement, 'cellXfs')[0], 'xf')) {
          const id = xAttr(xf, 'numFmtId') || '0';
          kinds.push(numFmtKind(Number(id), custom.has(id) ? custom.get(id) : null));
        }
      }
      const toDate = v => new Date(Math.round((v + (is1904 ? 1462 : 0) - 25569) * 86400000));
      function fmtDate(v, kind) {
        const d = toDate(v), o = { timeZone: 'UTC' };
        if (kind === 'time') return d.toLocaleTimeString('uk-UA', { ...o, hour: '2-digit', minute: '2-digit' });
        if (kind === 'date' || Number.isInteger(v)) return d.toLocaleDateString('uk-UA', o);
        return d.toLocaleString('uk-UA', { ...o, dateStyle: 'short', timeStyle: 'short' });
      }
      function cellValue(c) {
        const t = xAttr(c, 't'), v = xKid(c, 'v'), raw = v ? v.textContent : '';
        if (t === 's') return { text: shared[Number(raw)] || '' };
        if (t === 'inlineStr') return { text: xDesc(xKid(c, 'is'), 't').map(x => x.textContent).join('') };
        if (t === 'str' || t === 'e' || t === 'd') return { text: raw };
        if (t === 'b') return { text: raw === '1' ? 'TRUE' : 'FALSE' };
        if (raw === '') return { text: '' };
        const n = Number(raw);
        if (!isFinite(n)) return { text: raw };
        const kind = kinds[Number(xAttr(c, 's')) || 0] || '';
        if (kind === 'date' || kind === 'datetime' || kind === 'time') return { text: fmtDate(n, kind), num: true };
        if (kind === 'pct') return { text: fmtNum(n * 100) + '%', num: true };
        return { text: fmtNum(n), num: true };
      }

      async function sheetView(path) {
        const x = path && await zip.xml(path);
        if (!x) return el('div', { class: 'empty', text: 'Цей аркуш не містить таблиці (можливо, діаграма).' });
        const grid = new Map();
        let maxR = 0, maxC = 0, truncated = false, r = 0;
        for (const row of xDesc(x.documentElement, 'row')) {
          r = Number(xAttr(row, 'r')) || r + 1;
          if (r > XL_MAX_ROWS) { truncated = true; break; }
          let c = 0;
          for (const cell of xKids(row, 'c')) {
            const ref = xAttr(cell, 'r');
            c = ref ? colIndex(ref) : c + 1;
            if (c > XL_MAX_COLS) { truncated = true; continue; }
            const val = cellValue(cell);
            if (val.text === '') continue;
            grid.set(r + ':' + c, val);
            if (r > maxR) maxR = r;
            if (c > maxC) maxC = c;
          }
        }
        const merges = [];
        for (const m of xDesc(x.documentElement, 'mergeCell')) {
          const [a, b] = (xAttr(m, 'ref') || '').split(':');
          if (a && b) merges.push({ r1: rowIndex(a), c1: colIndex(a), r2: rowIndex(b), c2: colIndex(b) });
        }
        return gridView(grid, merges, maxR, maxC, truncated);
      }

      const sheets = xKids(xKid(wb.documentElement, 'sheets'), 'sheet')
        .filter(s => !/hidden/i.test(xAttr(s, 'state') || ''))
        .map(s => ({ name: xAttr(s, 'name') || 'Аркуш', path: (rels.get(xAttr(s, 'id')) || {}).target }));
      return sheetTabs(sheets, sh => sheetView(sh.path));
    }

    /* --- OpenDocument: odt / ods (+ templates ott/ots, flat XML fodt/fods) --- */
    function parseXmlBuf(buf, name) {
      const x = new DOMParser().parseFromString(new TextDecoder().decode(buf), 'application/xml');
      if (x.getElementsByTagName('parsererror').length) throw new Error('пошкоджений XML' + (name ? ': ' + name : ''));
      return x;
    }
    // text of an ODF paragraph-like node: collapse XML whitespace, honour text:s / tab / line-break
    function odfText(node) {
      let out = '';
      for (const n of node.childNodes) {
        if (n.nodeType === 3) out += n.nodeValue.replace(/[\t\n\r ]+/g, ' ');
        else if (n.nodeType !== 1) continue;
        else if (n.localName === 's') out += ' '.repeat(Math.min(Number(xAttr(n, 'c')) || 1, 200));
        else if (n.localName === 'tab') out += '\t';
        else if (n.localName === 'line-break') out += '\n';
        else if (n.localName !== 'annotation' && n.localName !== 'note') out += odfText(n);
      }
      return out;
    }
    // table rows in document order, flattening header-rows / row-groups
    function odfRows(table) {
      const out = [];
      const walk = n => {
        for (const c of n.children) {
          if (c.localName === 'table-row') out.push(c);
          else if (c.localName === 'table-header-rows' || c.localName === 'table-rows' || c.localName === 'table-row-group') walk(c);
        }
      };
      walk(table);
      return out;
    }
    const cssLen = v => {
      const m = /^([\d.]+)(cm|mm|in|pt|pc|px)?$/.exec(v || '');
      return m ? Math.round(Number(m[1]) * ({ cm: 37.8, mm: 3.78, in: 96, pt: 4 / 3, pc: 16, px: 1 }[m[2] || 'px'])) : 0;
    };
    function mimeOf(name, bytes) {
      const m = IMG_MIME[extOf(name || '')];
      if (m) return m;
      if (bytes && bytes[0] === 0x89 && bytes[1] === 0x50) return 'image/png';
      if (bytes && bytes[0] === 0xff && bytes[1] === 0xd8) return 'image/jpeg';
      if (bytes && bytes[0] === 0x47 && bytes[1] === 0x49) return 'image/gif';
      return null;
    }

    async function buildOdt(buf, flat) {
      let zip = null, content, stylesDoc = null;
      if (flat) { content = parseXmlBuf(buf); }
      else {
        zip = await unzip(buf);
        content = await zip.xml('content.xml');
        stylesDoc = await zip.xml('styles.xml');
      }
      const root = content && xDesc(content.documentElement, 'text').find(n => n.parentNode && n.parentNode.localName === 'body');
      if (!root) throw new Error('це не текстовий документ OpenDocument');

      // styles: 'family:name' -> { parent, outline, name, display, b, i, u, s, pos, align }
      const styles = new Map(), listStyles = new Map();
      for (const d of [stylesDoc, content]) {
        if (!d) continue;
        for (const st of xDesc(d.documentElement, 'style')) {
          const tp = xKid(st, 'text-properties'), pp = xKid(st, 'paragraph-properties');
          const fw = xAttr(tp, 'font-weight'), fs = xAttr(tp, 'font-style');
          const ul = xAttr(tp, 'text-underline-style'), lt = xAttr(tp, 'text-line-through-style'), tpos = xAttr(tp, 'text-position');
          styles.set(xAttr(st, 'family') + ':' + xAttr(st, 'name'), {
            parent: xAttr(st, 'parent-style-name'), outline: Number(xAttr(st, 'default-outline-level')) || 0,
            name: xAttr(st, 'name') || '', display: xAttr(st, 'display-name') || '',
            b: fw == null ? undefined : (fw === 'bold' || Number(fw) >= 600),
            i: fs == null ? undefined : (fs === 'italic' || fs === 'oblique'),
            u: ul == null ? undefined : ul !== 'none',
            s: lt == null ? undefined : lt !== 'none',
            pos: tpos == null ? undefined : (/^(super|[1-9])/.test(tpos) ? 'sup' : /^(sub|-)/.test(tpos) ? 'sub' : ''),
            align: xAttr(pp, 'text-align') || undefined
          });
        }
        for (const ls of xDesc(d.documentElement, 'list-style')) {
          const lv = {};
          for (const l of ls.children) lv[xAttr(l, 'level')] = l.localName === 'list-level-style-number' ? 'number' : 'bullet';
          listStyles.set(xAttr(ls, 'name'), lv);
        }
      }
      function prop(family, name, key) {
        for (let k = 0, cur = name; cur && k < 10; k++) {
          const st = styles.get(family + ':' + cur);
          if (!st) return undefined;
          if (st[key] !== undefined) return st[key];
          cur = st.parent;
        }
        return undefined;
      }
      function headingLevel(name) {
        for (let k = 0, cur = name; cur && k < 10; k++) {
          const st = styles.get('paragraph:' + cur);
          if (!st) return 0;
          if (st.outline) return st.outline;
          const label = st.display || st.name.replace(/_20_/g, ' ');
          const m = /^heading\s*(\d)/i.exec(label);
          if (m) return Number(m[1]);
          if (/^title$/i.test(label)) return 1;
          if (/^subtitle$/i.test(label)) return 2;
          cur = st.parent;
        }
        return 0;
      }

      const pending = [];
      function image(frame) {
        const im = xKid(frame, 'image');
        if (!im) return null;
        const href = (xAttr(im, 'href') || '').replace(/^\.\//, '');
        const bin = xKid(im, 'binary-data');
        if (!bin && (!zip || !href || /^[a-z]+:/i.test(href))) return null;
        const img = el('img', { alt: '' });
        const w = cssLen(xAttr(frame, 'width'));
        if (w) img.style.width = w + 'px';
        const load = bin
          ? new Promise(res => res(Uint8Array.from(atob(bin.textContent.replace(/\s+/g, '')), ch => ch.charCodeAt(0))))   // bad base64 → rejected, not thrown
          : zip.bytes(href);
        const placeholder = () => img.replaceWith(el('span', { class: 'docx-noimg', text: '[зображення ' + (extOf(href) || '?').toUpperCase() + ']' }));
        pending.push(load.then(b => {
          const mime = b && mimeOf(href, b);
          if (!mime) { placeholder(); return; }
          const u = URL.createObjectURL(new Blob([b], { type: mime }));
          blobUrls.push(u);
          img.src = u;
        }).catch(placeholder));
        return img;
      }

      function wrapFor(styleName) {
        const tags = [];
        if (prop('text', styleName, 'b')) tags.push('strong');
        if (prop('text', styleName, 'i')) tags.push('em');
        if (prop('text', styleName, 'u')) tags.push('u');
        if (prop('text', styleName, 's')) tags.push('s');
        const pos = prop('text', styleName, 'pos');
        if (pos) tags.push(pos);
        if (!tags.length) return null;
        const outer = el(tags[0]);
        let inner = outer;
        for (const t of tags.slice(1)) { const e = el(t); inner.append(e); inner = e; }
        return { outer, inner };
      }

      function inline(node, out) {
        for (const n of node.childNodes) {
          if (n.nodeType === 3) { const t = n.nodeValue.replace(/[\t\n\r ]+/g, ' '); if (t) out.append(t); continue; }
          if (n.nodeType !== 1) continue;
          switch (n.localName) {
            case 's': out.append(' '.repeat(Math.min(Number(xAttr(n, 'c')) || 1, 200))); break;
            case 'tab': out.append('\t'); break;
            case 'line-break': out.append(el('br')); break;
            case 'span': {
              const w = wrapFor(xAttr(n, 'style-name'));
              if (w) { inline(n, w.inner); out.append(w.outer); } else inline(n, out);
              break;
            }
            case 'a': {
              const href = xAttr(n, 'href');
              if (href && /^(https?:|mailto:)/i.test(href)) {
                const a = el('a', { href, target: '_blank', rel: 'noopener' });
                inline(n, a);
                out.append(a);
              } else inline(n, out);
              break;
            }
            case 'frame': {
              const img = image(n);
              if (img) out.append(img);
              else { const tb = xKid(n, 'text-box'); if (tb) inline(tb, out); }
              break;
            }
            case 'note': { const c = xKid(n, 'note-citation'); if (c) out.append(el('sup', { text: c.textContent })); break; }
            case 'p': case 'h': inline(n, out); out.append(el('br')); break;   // paragraphs inside text boxes
            case 'annotation': case 'annotation-end': case 'bookmark': case 'bookmark-start': case 'bookmark-end':
            case 'soft-page-break': case 'reference-mark-start': case 'reference-mark-end': case 'change': case 'change-start': case 'change-end':
              break;
            default: inline(n, out);   // fields (page number, date, sequence…) → their text
          }
        }
      }

      function paragraph(node, tag) {
        const sn = xAttr(node, 'style-name');
        const p = el(tag);
        const align = prop('paragraph', sn, 'align');
        if (align === 'center') p.style.textAlign = 'center';
        else if (align === 'end' || align === 'right') p.style.textAlign = 'right';
        else if (align === 'justify') p.style.textAlign = 'justify';
        if (tag === 'p' && prop('paragraph', sn, 'b')) p.style.fontWeight = 'bold';
        if (prop('paragraph', sn, 'i')) p.style.fontStyle = 'italic';
        inline(node, p);
        if (!p.childNodes.length) p.append(el('br'));
        return p;
      }

      function table(t) {
        const tbl = el('table');
        for (const row of odfRows(t)) {
          const rep = Math.min(Number(xAttr(row, 'number-rows-repeated')) || 1, 50);
          const tr = el('tr');
          for (const cell of row.children) {
            if (cell.localName !== 'table-cell') continue;   // covered-table-cell = part of a merged cell
            const crep = Math.min(Number(xAttr(cell, 'number-columns-repeated')) || 1, 50);
            const cs = Number(xAttr(cell, 'number-columns-spanned')) || 1, rs = Number(xAttr(cell, 'number-rows-spanned')) || 1;
            for (let k = 0; k < crep; k++) {
              const td = el('td', { colspan: cs > 1 ? cs : null, rowspan: rs > 1 ? rs : null });
              blocks(cell, td);
              tr.append(td);
            }
          }
          for (let k = 0; k < rep; k++) tbl.append(k ? tr.cloneNode(true) : tr);
        }
        return el('div', { class: 'tbl' }, tbl);
      }

      function blocks(node, out, listStyle, level) {
        for (const c of node.children) {
          switch (c.localName) {
            case 'h': {
              const lvl = Number(xAttr(c, 'outline-level')) || headingLevel(xAttr(c, 'style-name')) || 1;
              out.append(paragraph(c, 'h' + Math.min(lvl, 6)));
              break;
            }
            case 'p': {
              const lvl = headingLevel(xAttr(c, 'style-name'));
              out.append(paragraph(c, lvl ? 'h' + Math.min(lvl, 6) : 'p'));
              break;
            }
            case 'list': {
              const ls = xAttr(c, 'style-name') || listStyle, lev = (level || 0) + 1;
              const kind = (listStyles.get(ls) || {})[lev] || 'bullet';
              const list = el(kind === 'number' ? 'ol' : 'ul');
              for (const it of c.children) {
                if (it.localName !== 'list-item' && it.localName !== 'list-header') continue;
                const li = el('li');
                if (it.localName === 'list-header') li.style.listStyle = 'none';
                blocks(it, li, ls, lev);
                list.append(li);
              }
              out.append(list);
              break;
            }
            case 'table': out.append(table(c)); break;
            case 'section': case 'index-body': case 'index-title': case 'table-of-content': case 'alphabetical-index':
            case 'illustration-index': case 'object-index': case 'user-index': case 'table-index': case 'bibliography':
              blocks(c, out, listStyle, level); break;
          }
        }
      }

      const page = el('div', { class: 'docx-page' });
      blocks(root, page);
      await Promise.all(pending);
      return page;
    }

    async function buildOds(buf, flat) {
      const content = flat ? parseXmlBuf(buf) : await (await unzip(buf)).xml('content.xml');
      const sheetRoot = content && xDesc(content.documentElement, 'spreadsheet')[0];
      if (!sheetRoot) throw new Error('це не таблиця OpenDocument');
      const NUMERIC = new Set(['float', 'percentage', 'currency', 'date', 'time']);

      function sheetView(table) {
        const grid = new Map(), merges = [];
        let maxR = 0, maxC = 0, truncated = false, r = 0;
        for (const row of odfRows(table)) {
          const rep = Number(xAttr(row, 'number-rows-repeated')) || 1;
          const cells = [];
          let c = 0;
          for (const cell of row.children) {
            const ln = cell.localName;
            if (ln !== 'table-cell' && ln !== 'covered-table-cell') continue;
            const crep = Number(xAttr(cell, 'number-columns-repeated')) || 1;
            // LibreOffice stores the formatted display text in text:p, so dates/currency come out as shown
            const text = ln === 'table-cell' ? xKids(cell, 'p').map(odfText).join('\n').trim() : '';
            if (!text) { c += crep; continue; }   // empty cells are often repeated thousands of times
            const num = NUMERIC.has(xAttr(cell, 'value-type'));
            const cs = Number(xAttr(cell, 'number-columns-spanned')) || 1, rs = Number(xAttr(cell, 'number-rows-spanned')) || 1;
            for (let k = 0; k < crep; k++) {
              if (++c > XL_MAX_COLS) { truncated = true; break; }
              cells.push({ c, text, num, cs, rs });
            }
          }
          if (!cells.length) { r += rep; continue; }
          for (let k = 0; k < rep; k++) {
            if (++r > XL_MAX_ROWS) { truncated = true; break; }
            for (const x of cells) {
              grid.set(r + ':' + x.c, { text: x.text, num: x.num });
              if (x.cs > 1 || x.rs > 1) merges.push({ r1: r, c1: x.c, r2: r + x.rs - 1, c2: x.c + x.cs - 1 });
              if (x.c > maxC) maxC = x.c;
            }
            maxR = r;
          }
          if (r > XL_MAX_ROWS) break;
        }
        return gridView(grid, merges, maxR, maxC, truncated);
      }

      const sheets = xKids(sheetRoot, 'table').map(t => ({ name: xAttr(t, 'name') || 'Аркуш', node: t }));
      return sheetTabs(sheets, sh => sheetView(sh.node));
    }

    async function renderOffice() {
      const { segs, type } = fileCtx;
      const st = $('stage');
      st.className = 'stage';
      st.replaceChildren(el('div', { class: 'empty', text: 'Відкриваю документ…' }));
      try {
        const res = await fetch(pathOf(segs), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const buf = await res.arrayBuffer();
        if (fileCtx.segs !== segs) return;
        const flat = /^f(odt|ods)$/.test(extOf(fileCtx.name));   // LibreOffice flat XML, not zipped
        const node = type === 'docx' ? await buildDocx(buf) : type === 'xlsx' ? await buildXlsx(buf)
          : type === 'odt' ? await buildOdt(buf, flat) : await buildOds(buf, flat);
        if (fileCtx.segs !== segs) return;
        st.className = 'stage ' + (type === 'docx' || type === 'odt' ? 'docx' : 'xlsx');
        st.replaceChildren(node);
        st.after(el('p', { class: 'note', text: 'Спрощений перегляд: складне форматування може відрізнятися від оригіналу. Точна копія — «Скачати».' }));
      } catch (e) {
        console.error(e);
        if (fileCtx.segs === segs) noPreview('Не вдалося відкрити документ: ' + e.message);
      }
    }

    /* ---------- 3D models: stl (static software render: no WebGL, no libraries) ---------- */
    const MODEL_MAX = 150 * 1024 * 1024;

    function parseStl(buf) {
      const dv = new DataView(buf);
      if (buf.byteLength >= 84) {
        const n = dv.getUint32(80, true);
        if (84 + n * 50 === buf.byteLength) {           // binary STL: exact size check (some start with "solid" too)
          const pos = new Float32Array(n * 9);
          for (let i = 0; i < n; i++) {
            const o = 84 + i * 50 + 12;                  // skip the 12-byte normal
            for (let k = 0; k < 9; k++) pos[i * 9 + k] = dv.getFloat32(o + k * 4, true);
          }
          return { pos };
        }
      }
      const text = new TextDecoder().decode(buf);
      const re = /vertex\s+(\S+)\s+(\S+)\s+(\S+)/g;
      const out = [];
      let m;
      while ((m = re.exec(text))) out.push(Number(m[1]), Number(m[2]), Number(m[3]));
      if (!out.length || out.length % 9) throw new Error('не вдалося розібрати STL');
      return { pos: Float32Array.from(out) };
    }

    // Orthographic views, Z up. th = rotation around Z, ph = elevation (camera looks along +Y after rotation).
    const VIEWS3D = {
      iso:    { label: 'Ізометрія',       th: -Math.PI / 4,    ph: Math.PI / 6 },
      iso2:   { label: 'Ізометрія ззаду', th: 3 * Math.PI / 4, ph: Math.PI / 6 },
      front:  { label: 'Спереду', th: 0,            ph: 0 },
      back:   { label: 'Ззаду',   th: Math.PI,      ph: 0 },
      left:   { label: 'Зліва',   th: Math.PI / 2,  ph: 0 },
      right:  { label: 'Справа',  th: -Math.PI / 2, ph: 0 },
      top:    { label: 'Зверху',  th: 0,            ph: Math.PI / 2 },
      bottom: { label: 'Знизу',   th: 0,            ph: -Math.PI / 2 },
      // drawing sheet, first-angle (ДСТУ/ЄСКД): front top-left, left view to its right, top view below it
      sheet:  { label: '4 види', cells: [['front', 'Вид спереду'], ['left', 'Вид зліва'], ['top', 'Вид зверху'], ['iso', 'Ізометрія']] }
    };

    // z-buffer rasteriser for one view. W = 0 → only measure the projected extent (for a shared scale).
    // Returns RGBA pixels (transparent background) + model size + triangle count.
    function rasterMesh(pos, W, H, view = VIEWS3D.iso, fixedScale = 0) {
      let minX = Infinity, minY = Infinity, minZ = Infinity, maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
      for (let i = 0; i < pos.length; i += 3) {
        const x = pos[i], y = pos[i + 1], z = pos[i + 2];
        if (!isFinite(x) || !isFinite(y) || !isFinite(z)) continue;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
        if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
      }
      if (!isFinite(minX)) throw new Error('модель порожня');
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, cz = (minZ + maxZ) / 2;
      const th = view.th, ph = view.ph;
      const ct = Math.cos(th), st = Math.sin(th), cp = Math.cos(ph), sp = Math.sin(ph);
      const V = new Float32Array(pos.length);   // view space: right, up, depth (bigger = farther)
      let sx0 = Infinity, sx1 = -Infinity, sy0 = Infinity, sy1 = -Infinity, d0 = Infinity, d1 = -Infinity;
      for (let i = 0; i < pos.length; i += 3) {
        const x = pos[i] - cx, y = pos[i + 1] - cy, z = pos[i + 2] - cz;
        const x1 = x * ct - y * st, y1 = x * st + y * ct;
        const sx = x1, sy = y1 * sp + z * cp, d = y1 * cp - z * sp;
        V[i] = sx; V[i + 1] = sy; V[i + 2] = d;
        if (sx < sx0) sx0 = sx; if (sx > sx1) sx1 = sx;
        if (sy < sy0) sy0 = sy; if (sy > sy1) sy1 = sy;
        if (d < d0) d0 = d; if (d > d1) d1 = d;
      }
      const span = Math.max(sx1 - sx0, sy1 - sy0, 1e-9);
      if (!W) return { ext: [Math.max(sx1 - sx0, span * 0.05), Math.max(sy1 - sy0, span * 0.05)] };
      const scale = fixedScale || Math.min(W * 0.9 / Math.max(sx1 - sx0, span * 0.05), H * 0.9 / Math.max(sy1 - sy0, span * 0.05));
      const ox = W / 2 - (sx0 + sx1) / 2 * scale, oy = H / 2 + (sy0 + sy1) / 2 * scale;
      const zbuf = new Float32Array(W * H).fill(Infinity);
      const px = new Uint8ClampedArray(W * H * 4);
      // key light from upper-left-front; normals are turned towards the camera (STL winding is often
      // inconsistent, and every visible face faces the viewer) → top bright, left medium, right dark
      let lx = -0.5, ly = 0.75, lz = -0.45;
      const ll = Math.hypot(lx, ly, lz); lx /= ll; ly /= ll; lz /= ll;
      const BASE = [245, 130, 32];   // orange part: contrasts with the blue UI on light and dark backgrounds
      let tris = 0;
      for (let t = 0; t < V.length; t += 9) {
        const ax = V[t] * scale + ox, ay = oy - V[t + 1] * scale, az = V[t + 2];
        const bx = V[t + 3] * scale + ox, by = oy - V[t + 4] * scale, bz = V[t + 5];
        const qx = V[t + 6] * scale + ox, qy = oy - V[t + 7] * scale, qz = V[t + 8];
        if (!(isFinite(ax) && isFinite(bx) && isFinite(qx) && isFinite(ay) && isFinite(by) && isFinite(qy))) continue;
        tris++;
        // normal in view space (use un-flipped y)
        const ux = V[t + 3] - V[t], uy = V[t + 4] - V[t + 1], uz = V[t + 5] - V[t + 2];
        const vx = V[t + 6] - V[t], vy = V[t + 7] - V[t + 1], vz = V[t + 8] - V[t + 2];
        let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
        const nl = (nz > 0 ? -1 : 1) * (Math.hypot(nx, ny, nz) || 1);   // flip to face the camera (camera looks along +depth)
        nx /= nl; ny /= nl; nz /= nl;
        const shade = 0.35 + 0.6 * Math.max(0, nx * lx + ny * ly + nz * lz) + 0.12 * Math.max(0, -nz);
        const r = BASE[0] * shade, g = BASE[1] * shade, b = BASE[2] * shade;
        const area = (bx - ax) * (qy - ay) - (by - ay) * (qx - ax);
        if (area === 0) continue;
        const inv = 1 / area;
        const xa = Math.max(0, Math.floor(Math.min(ax, bx, qx))), xb = Math.min(W - 1, Math.ceil(Math.max(ax, bx, qx)));
        const ya = Math.max(0, Math.floor(Math.min(ay, by, qy))), yb = Math.min(H - 1, Math.ceil(Math.max(ay, by, qy)));
        for (let y = ya; y <= yb; y++) {
          const py = y + 0.5;
          for (let x = xa; x <= xb; x++) {
            const pxl = x + 0.5;
            const w0 = ((bx - pxl) * (qy - py) - (by - py) * (qx - pxl)) * inv;
            if (w0 < 0) continue;
            const w1 = ((qx - pxl) * (ay - py) - (qy - py) * (ax - pxl)) * inv;
            if (w1 < 0) continue;
            const w2 = 1 - w0 - w1;
            if (w2 < 0) continue;
            const z = w0 * az + w1 * bz + w2 * qz, idx = y * W + x;
            if (z >= zbuf[idx]) continue;
            zbuf[idx] = z;
            const o = idx * 4;
            px[o] = r; px[o + 1] = g; px[o + 2] = b; px[o + 3] = 255;
          }
        }
      }
      // outlines: darken where depth jumps (silhouettes, sharp steps) — gives the shape definition
      const jump = (d1 - d0) * 0.02 + 1e-9;
      for (let y = 0; y < H - 1; y++) for (let x = 0; x < W - 1; x++) {
        const i = y * W + x, z = zbuf[i];
        if (z === Infinity) continue;
        const zr = zbuf[i + 1], zd = zbuf[i + W];
        if (zr === Infinity || zd === Infinity || Math.abs(zr - z) > jump || Math.abs(zd - z) > jump) {
          const o = i * 4;
          px[o] *= 0.55; px[o + 1] *= 0.55; px[o + 2] *= 0.55;
        }
      }
      return { pixels: px, size: [maxX - minX, maxY - minY, maxZ - minZ], tris };
    }

    // Render one view (or the 4-view sheet) to a canvas sized for the page.
    function drawModelView(pos, key, cssW, name) {
      const v = VIEWS3D[key];
      const dpr = window.devicePixelRatio || 1;
      const cssH = Math.max(300, Math.min(Math.round(window.innerHeight * (v.cells ? 0.8 : 0.7)), Math.round(cssW * 0.75)));
      const ss = Math.min(2 * dpr, 2400 / cssW);   // supersample for smooth edges
      const W = Math.round(cssW * ss), H = Math.round(cssH * ss);
      const big = document.createElement('canvas');
      big.width = W; big.height = H;
      const bctx = big.getContext('2d');
      let first = null;
      if (!v.cells) {
        first = rasterMesh(pos, W, H, v);
        bctx.putImageData(new ImageData(first.pixels, W, H), 0, 0);
      } else {
        const cw = Math.floor(W / 2), ch = Math.floor(H / 2);
        // one scale for all views so sizes are comparable (leave room for the label)
        let scale = Infinity;
        for (const [k] of v.cells) {
          const e = rasterMesh(pos, 0, 0, VIEWS3D[k]).ext;
          scale = Math.min(scale, cw * 0.82 / e[0], ch * 0.72 / e[1]);
        }
        v.cells.forEach(([k], n) => {
          const r = rasterMesh(pos, cw, ch, VIEWS3D[k], scale);
          first = first || r;
          bctx.putImageData(new ImageData(r.pixels, cw, ch), (n % 2) * cw, Math.floor(n / 2) * ch);
        });
      }
      const cv = el('canvas', { role: 'img', 'aria-label': v.label + ': ' + name });
      cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
      cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(big, 0, 0, cv.width, cv.height);
      if (v.cells) {   // separators + labels
        const css = getComputedStyle(document.body);
        ctx.scale(dpr, dpr);
        ctx.strokeStyle = css.getPropertyValue('--border').trim() || '#ccc';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cssW / 2, 0); ctx.lineTo(cssW / 2, cssH);
        ctx.moveTo(0, cssH / 2); ctx.lineTo(cssW, cssH / 2);
        ctx.stroke();
        ctx.fillStyle = css.getPropertyValue('--muted').trim() || '#666';
        ctx.font = '13px ' + (css.getPropertyValue('--font').trim() || 'sans-serif');
        v.cells.forEach(([, label], n) => ctx.fillText(label, (n % 2) * cssW / 2 + 10, Math.floor(n / 2) * cssH / 2 + 20));
      }
      return { canvas: cv, size: first.size, tris: first.tris };
    }

    async function renderModel() {
      const { segs, name } = fileCtx;
      const st = $('stage');
      st.className = 'stage model';
      st.replaceChildren(el('div', { class: 'empty', text: 'Завантаження моделі…' }));
      try {
        const res = await fetch(pathOf(segs), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const buf = await res.arrayBuffer();
        if (fileCtx.segs !== segs) return;
        const mesh = parseStl(buf);
        if (fileCtx.segs !== segs) return;
        const holder = el('div', { class: 'model-view' });
        const tabs = el('div', { class: 'sheet-tabs', role: 'tablist', 'aria-label': 'Проекція' });
        const cache = new Map();
        let info = null, seq = 0;
        const show = async key => {
          const my = ++seq;
          try { localStorage.setItem('docs.view3d', key); } catch (_) {}
          tabs.querySelectorAll('button').forEach(b => { const on = b.dataset.key === key; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
          if (!cache.has(key)) {
            holder.replaceChildren(el('div', { class: 'empty', text: 'Рендеринг…' }));
            await new Promise(r => setTimeout(r, 20));   // let the message paint before the heavy loop
            if (my !== seq || fileCtx.segs !== segs) return;
            const r = drawModelView(mesh.pos, key, Math.max(300, st.clientWidth || 800), name);
            cache.set(key, r.canvas);
            info = info || r;
          }
          if (my !== seq || fileCtx.segs !== segs) return;
          holder.replaceChildren(cache.get(key));
        };
        for (const [key, v] of Object.entries(VIEWS3D)) {
          tabs.append(el('button', { type: 'button', role: 'tab', 'data-key': key, text: v.label, onclick: () => show(key) }));
        }
        st.replaceChildren(tabs, holder);
        let start = 'iso';
        try { const k = localStorage.getItem('docs.view3d'); if (VIEWS3D[k]) start = k; } catch (_) {}
        await show(start);
        if (fileCtx.segs !== segs || !info) return;
        const mm = v => (+v.toFixed(v < 10 ? 2 : 1)).toLocaleString('uk-UA');
        st.after(el('p', { class: 'note', text: 'Розмір: ' + info.size.map(mm).join(' × ') + ' мм (X × Y × Z) · '
          + info.tris.toLocaleString('uk-UA') + ' трикутників · STL не зберігає одиниці, прийнято мм' }));
      } catch (e) {
        console.error(e);
        if (fileCtx.segs === segs) noPreview('Не вдалося відкрити модель: ' + e.message);
      }
    }

    /* ---------- PDF viewer: pdf.js (Mozilla, Apache-2.0) vendored in assets/pdfjs, our own UI ---------- */
    const PDFJS = '__ASSETS_PREFIX__pdfjs/';   // dufs replaces the placeholder with its assets path
    let pdfjsLib = null, pdfView = null;

    async function loadPdfjs() {
      if (!pdfjsLib) {
        pdfjsLib = await import(PDFJS + 'pdf.min.mjs');
        pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.mjs';
      }
      return pdfjsLib;
    }

    function closePdf() {
      const v = pdfView;
      if (!v) return;
      pdfView = null;
      v.closed = true;
      if (v.observer) v.observer.disconnect();
      window.removeEventListener('resize', v.onResize);
      v.pages.forEach(p => { if (p.task) p.task.cancel(); });
      v.task.destroy();
    }

    function pdfIframeFallback(url) {   // browser's built-in viewer (used if pdf.js cannot load)
      const st = $('stage');
      st.className = 'stage';
      st.replaceChildren(el('iframe', { src: url, title: fileCtx.name }));
      st.after(el('p', { class: 'note', text: 'Якщо PDF не показується (наприклад, на телефоні) — натисніть «Відкрити окремо» або «Скачати».' }));
    }

    async function renderPdf() {
      const { segs } = fileCtx;
      const url = pathOf(segs);
      const st = $('stage');
      st.className = 'stage pdfv';
      const status = el('div', { class: 'empty', text: 'Завантаження PDF…' });
      st.replaceChildren(status);
      let lib;
      try { lib = await loadPdfjs(); }
      catch (e) { console.error(e); if (fileCtx.segs === segs) pdfIframeFallback(url); return; }
      if (fileCtx.segs !== segs) return;

      const task = lib.getDocument({
        url, isEvalSupported: false, enableXfa: false,
        cMapUrl: PDFJS + 'cmaps/', cMapPacked: true,
        standardFontDataUrl: PDFJS + 'standard_fonts/', wasmUrl: PDFJS + 'wasm/', iccUrl: PDFJS + 'iccs/'
      });
      const v = { task, doc: null, pages: [], scale: 0, visible: new Set(), closed: false };
      pdfView = v;
      task.onProgress = p => { if (p.total) status.textContent = 'Завантаження PDF… ' + Math.min(100, Math.round(p.loaded / p.total * 100)) + '%'; };
      task.onPassword = (update, reason) => {
        const pw = prompt(reason === lib.PasswordResponses.INCORRECT_PASSWORD ? 'Невірний пароль. Пароль до PDF:' : 'PDF захищено паролем. Введіть пароль:');
        if (pw == null) { closePdf(); noPreview('PDF захищено паролем.'); }
        else update(pw);
      };
      try { v.doc = await task.promise; }
      catch (e) {
        if (v.closed) return;
        console.error(e);
        closePdf();
        if (fileCtx.segs === segs) noPreview('Не вдалося відкрити PDF: ' + (e && e.message || e));
        return;
      }
      if (v.closed || fileCtx.segs !== segs) return;

      const n = v.doc.numPages;
      const first = (await v.doc.getPage(1)).getViewport({ scale: 1 });
      v.base = { w: first.width, h: first.height };   // placeholder size until a page's own size is known

      const pagesBox = el('div', { class: 'pdf-pages' });
      for (let i = 0; i < n; i++) {
        const canvas = el('canvas');
        const wrap = el('div', { class: 'pdf-page', 'data-i': String(i) }, canvas);
        v.pages.push({ wrap, canvas, w: 0, h: 0, rendered: 0, task: null, busy: false });
        pagesBox.append(wrap);
      }
      st.replaceChildren(pagesBox);

      // pages always fit the width (pinch-zoom on phones still works)
      function fit() {
        v.scale = Math.max(200, pagesBox.clientWidth - 24) / v.base.w;
        v.pages.forEach(p => {
          p.wrap.style.width = Math.floor((p.w || v.base.w) * v.scale) + 'px';
          p.wrap.style.height = Math.floor((p.h || v.base.h) * v.scale) + 'px';
        });
        renderVisible();
      }

      async function renderPage(i) {
        const p = v.pages[i];
        if (p.busy || p.rendered === v.scale || v.closed) return;
        p.busy = true;
        try {
          const page = await v.doc.getPage(i + 1);
          if (!p.w) {   // real page size (pages may differ from page 1)
            const vp1 = page.getViewport({ scale: 1 });
            p.w = vp1.width; p.h = vp1.height;
            p.wrap.style.width = Math.floor(p.w * v.scale) + 'px';
            p.wrap.style.height = Math.floor(p.h * v.scale) + 'px';
          }
          const scale = v.scale;
          let ratio = Math.min(window.devicePixelRatio || 1, 2);
          const cssW = p.w * scale, cssH = p.h * scale, MAXPX = 16e6;   // phones cap canvas size
          if (cssW * cssH * ratio * ratio > MAXPX) ratio = Math.sqrt(MAXPX / (cssW * cssH));
          const off = document.createElement('canvas');                 // draw off-screen, swap when done (no flicker)
          off.width = Math.floor(cssW * ratio); off.height = Math.floor(cssH * ratio);
          p.task = page.render({ canvas: off, viewport: page.getViewport({ scale: scale * ratio }) });
          await p.task.promise;
          if (v.closed || !v.visible.has(i)) return;
          p.canvas.width = off.width; p.canvas.height = off.height;
          p.canvas.getContext('2d').drawImage(off, 0, 0);
          off.width = off.height = 0;
          p.rendered = scale;
        } catch (e) {
          if (!(e && e.name === 'RenderingCancelledException')) console.error(e);
        } finally {
          p.busy = false;
          p.task = null;
        }
        if (!v.closed && v.visible.has(i) && p.rendered !== v.scale) renderPage(i);   // width changed meanwhile
      }
      let queue = Promise.resolve();
      function renderVisible() {
        [...v.visible].sort((a, b) => a - b).forEach(i => { queue = queue.then(() => renderPage(i)); });   // one at a time: bounded memory
      }
      function release(i) {   // far from the screen: free the canvas memory
        const p = v.pages[i];
        if (p.task) p.task.cancel();
        p.canvas.width = p.canvas.height = 0;
        p.rendered = 0;
      }
      v.observer = new IntersectionObserver(entries => {
        for (const en of entries) {
          const i = Number(en.target.dataset.i);
          if (en.isIntersecting) v.visible.add(i);
          else { v.visible.delete(i); release(i); }
        }
        renderVisible();
      }, { rootMargin: '1200px 0px' });
      v.pages.forEach(p => v.observer.observe(p.wrap));

      let rt = null;
      v.onResize = () => { clearTimeout(rt); rt = setTimeout(() => { if (!v.closed) fit(); }, 200); };
      window.addEventListener('resize', v.onResize);
      fit();
    }

    /* ---------- text loading ---------- */
    async function fetchText(segs) {
      const res = await fetch(pathOf(segs), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const buf = await res.arrayBuffer();
      let text, encoding = 'UTF-8';
      try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
      catch (_) { text = new TextDecoder('windows-1251').decode(buf); encoding = 'Windows-1251'; }
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      return { text, encoding, etag: res.headers.get('etag') };
    }

    /* ---------- file view ---------- */
    let fileCtx = null;   // { segs, name, type, info, siblings, idx }

    async function showFile() {
      const segs = S.segs;
      const name = segs[segs.length - 1] || '';
      const type = typeOf(name);
      const editMode = location.hash === '#edit';
      fileCtx = { segs, name, type, info: null, siblings: [], idx: -1 };
      document.title = name + ' — Документація';
      renderCrumbs(segs, true);
      $('view-icon').replaceChildren(typeIcon(type));
      $('view-name').textContent = name;
      $('view-meta').textContent = '';
      $('view-actions').replaceChildren();
      $('stage').replaceChildren();
      $('stage').className = '';

      // parent listing → permissions, metadata, prev/next
      try {
        const data = await getJson(dirHref(segs.slice(0, -1)) + '?json');
        if (fileCtx.segs !== segs) return;
        applyPerms(data);
        if (data.dir_exists === false || !(data.paths || []).some(p => !isDir(p) && p.name === name)) {
          return goNearestExisting(segs);   // the file (or its folder) no longer exists
        }
        const files = (data.paths || []).filter(p => !isDir(p) && !p.name.startsWith('.'));
        files.sort((a, b) => collator.compare(a.name, b.name));
        fileCtx.siblings = files;
        fileCtx.idx = files.findIndex(p => p.name === name);
        fileCtx.info = files[fileCtx.idx] || null;
      } catch (e) {
        if (fileCtx.segs !== segs) return;
        if (e.locked) {
          $('stage').className = 'stage';
          return showUnlock($('stage'), e.locked, () => { if (fileCtx && fileCtx.segs === segs) render(); });
        }
        if (/HTTP 404/.test(e.message)) return goNearestExisting(segs);
        console.error(e);
      }
      if (fileCtx.segs !== segs) return;

      const info = fileCtx.info;
      if (info) $('view-meta').textContent = [formatSize(info.size), formatDate(info.mtime)].filter(Boolean).join(' · ');
      const canEdit = S.canWrite && isTextual(type) && (!info || info.size <= TEXT_MAX);
      renderViewActions(canEdit, editMode && canEdit);

      if (editMode && canEdit) return openEditor();
      renderStage();
    }

    function renderViewActions(canEdit, editMode) {
      const { segs, name, siblings, idx } = fileCtx;
      const acts = [];
      if (siblings.length > 1 && idx >= 0 && !editMode) {
        const prev = siblings[(idx - 1 + siblings.length) % siblings.length];
        const next = siblings[(idx + 1) % siblings.length];
        acts.push(linkBtn('chevron_left', 'Попередній: ' + prev.name, 'btn-soft', viewHref(segs.slice(0, -1).concat(prev.name)), { iconOnly: true }));
        acts.push(linkBtn('chevron_right', 'Наступний: ' + next.name, 'btn-soft', viewHref(segs.slice(0, -1).concat(next.name)), { iconOnly: true }));
        acts.slice(-2).forEach(a => a.setAttribute('data-spa', ''));
      }
      if (editMode) {
        acts.push(button('save', 'Зберегти', 'btn-success', () => saveEditor()));
        acts.push(button('visibility', 'Закрити редактор', 'btn-soft', () => closeEditor()));
      } else {
        if (canEdit) { const a = linkBtn('edit', 'Редагувати', 'btn-primary', editHref(segs)); a.setAttribute('data-spa', ''); acts.push(a); }
        acts.push(linkBtn('download', 'Скачати', 'btn-soft', pathOf(segs), { download: name }));
        acts.push(linkBtn('open_in_new', 'Відкрити окремо', 'btn-soft', pathOf(segs), { iconOnly: true, target: '_blank' }));
        acts.push(button('link', 'Копіювати посилання', 'btn-soft', () => copyLink(segs), { iconOnly: true }));
        if (S.canWrite && S.canDelete) acts.push(button('move', 'Перейменувати / перемістити', 'btn-soft', () => renameOrMove(segs, false), { iconOnly: true }));
        if (S.canDelete) acts.push(button('delete', 'Видалити', 'btn-danger', () => removePath(segs, false), { iconOnly: true }));
      }
      $('view-actions').replaceChildren(...acts);
    }

    function noPreview(msg) {
      const st = $('stage');
      st.className = 'stage nopreview';
      st.replaceChildren(typeIcon(fileCtx.type),
        el('div', { text: msg || 'Попередній перегляд для цього типу файлів недоступний.' }),
        el('div', { class: 'np-actions' },
          linkBtn('download', 'Скачати', 'btn-primary', pathOf(fileCtx.segs), { download: fileCtx.name }),
          fileCtx.type === 'other' && (!fileCtx.info || fileCtx.info.size <= TEXT_MAX)
            ? button('text', 'Показати як текст', 'btn-soft', () => renderText(true)) : null));
    }

    async function renderStage() {
      const { segs, type, info } = fileCtx;
      const st = $('stage');
      const url = pathOf(segs);
      if (type === 'video') {
        st.className = 'stage media';
        const v = el('video', { controls: true, preload: 'metadata', playsinline: true, src: url });
        v.addEventListener('error', () => {
          st.replaceChildren(el('div', { class: 'media-error' },
            el('p', { text: 'Браузер не може відтворити цей формат відео (' + extOf(fileCtx.name).toUpperCase() + ').' }),
            el('p', { class: 'note', style: 'color:#ccc', text: 'Скачайте файл і відкрийте у VLC, або конвертуйте в MP4 (H.264).' })));
        });
        st.replaceChildren(v);
      } else if (type === 'audio') {
        st.className = 'stage audio';
        st.replaceChildren(typeIcon('audio'), el('audio', { controls: true, preload: 'metadata', src: url }));
      } else if (type === 'image') {
        st.className = 'stage image';
        const img = el('img', { src: url, alt: fileCtx.name });
        img.addEventListener('click', () => st.classList.toggle('zoom'));
        st.replaceChildren(img);
      } else if (type === 'pdf') {
        await renderPdf();
      } else if (type === 'docx' || type === 'xlsx' || type === 'odt' || type === 'ods') {
        if (info && info.size > OFFICE_MAX) return noPreview('Документ завеликий для перегляду в браузері (' + formatSize(info.size) + ').');
        await renderOffice();
      } else if (type === 'model') {
        if (info && info.size > MODEL_MAX) return noPreview('Модель завелика для перегляду в браузері (' + formatSize(info.size) + ').');
        await renderModel();
      } else if (type === 'legacy') {
        noPreview('Перегляд формату .' + extOf(fileCtx.name) + ' недоступний (підтримуються .docx, .xlsx, .odt, .ods). Скачайте файл або збережіть його у новому форматі.');
      } else if (isTextual(type)) {
        if (info && info.size > TEXT_MAX) return noPreview('Файл завеликий для перегляду в браузері (' + formatSize(info.size) + ').');
        await renderText(false);
      } else {
        noPreview();
      }
    }

    async function renderText(forcePlain) {
      const { segs, type } = fileCtx;
      const st = $('stage');
      st.className = 'stage';
      st.replaceChildren(el('div', { class: 'empty', text: 'Завантаження…' }));
      let r;
      try { r = await fetchText(segs); }
      catch (e) { if (fileCtx.segs === segs) noPreview('Не вдалося завантажити файл: ' + e.message); return; }
      if (fileCtx.segs !== segs) return;
      if (type === 'md' && !forcePlain) {
        const box = el('article', { class: 'md' });
        box.innerHTML = md(r.text);
        st.replaceChildren(box);
      } else if (type === 'csv' && !forcePlain) {
        const rows = parseCsv(r.text, detectDelim(r.text, extOf(fileCtx.name)));
        const width = Math.max(0, ...rows.slice(0, 200).map(x => x.length));
        const head = rows.shift() || [];
        const table = el('table', {},
          el('thead', {}, el('tr', {}, el('th', { text: '#' }), ...Array.from({ length: width }, (_, j) => el('th', { text: head[j] || '' })))),
          el('tbody', {}, ...rows.map((row, i) => el('tr', {}, el('td', { class: 'n', text: String(i + 1) }),
            ...Array.from({ length: width }, (_, j) => el('td', { text: row[j] || '' }))))));
        st.className = 'stage csv';
        st.replaceChildren(table);
        if (rows.length >= CSV_MAX_ROWS) st.after(el('p', { class: 'note', text: 'Показано перші ' + CSV_MAX_ROWS + ' рядків.' }));
      } else {
        st.className = 'stage text';
        st.replaceChildren(el('pre', { text: r.text }));
      }
      if (r.encoding !== 'UTF-8') st.after(el('p', { class: 'note', text: 'Кодування: ' + r.encoding + '. Після редагування файл буде збережено в UTF-8.' }));
    }

    /* ---------- editor ---------- */
    async function openEditor() {
      const { segs } = fileCtx;
      const st = $('stage');
      st.className = 'stage';
      st.replaceChildren(el('div', { class: 'empty', text: 'Завантаження…' }));
      let r;
      try { r = await fetchText(segs); }
      catch (e) { if (fileCtx.segs === segs) noPreview('Не вдалося завантажити файл: ' + e.message); return; }
      if (fileCtx.segs !== segs) return;

      const ta = el('textarea', { spellcheck: 'false', 'aria-label': 'Вміст файлу' });
      ta.value = r.text;
      const status = el('span');
      const pos = el('span');
      S.editor = { segs, ta, original: r.text, etag: r.etag, saving: false, status };
      const updateStatus = () => {
        const dirty = ta.value !== S.editor.original;
        status.className = dirty ? 'dirty' : '';
        status.textContent = dirty ? '● Є незбережені зміни' : 'Збережено';
        const before = ta.value.slice(0, ta.selectionStart);
        pos.textContent = 'Рядок ' + (before.split('\n').length) + ' · ' + ta.value.length + ' симв. · Ctrl+S — зберегти';
      };
      ta.addEventListener('input', updateStatus);
      ta.addEventListener('keyup', updateStatus);
      ta.addEventListener('click', updateStatus);
      ta.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveEditor(); }
        else if (e.key === 'Tab' && !e.shiftKey) {
          e.preventDefault();
          ta.setRangeText('\t', ta.selectionStart, ta.selectionEnd, 'end');
          updateStatus();
        }
      });
      st.className = 'stage editor';
      st.replaceChildren(ta, el('div', { class: 'editor-status' }, status, pos));
      if (fileCtx.type === 'md') {   // Markdown syntax reference, top-right of the editor
        ta.classList.add('md');
        const help = el('button', { class: 'md-help', type: 'button', onclick: () => openMdHelp(ta),
          title: 'Шпаргалка з Markdown', 'aria-label': 'Шпаргалка з Markdown' });
        help.innerHTML = iconHtml('info');
        st.append(help);
      }
      if (r.encoding !== 'UTF-8') st.after(el('p', { class: 'note', text: 'Файл у кодуванні ' + r.encoding + '; буде збережено в UTF-8.' }));
      updateStatus();
      ta.focus();
    }

    /* ---------- built-in Markdown cheat sheet (Ukrainian) ---------- */
    // show = what the user sees as the example, ins = what gets inserted, out = custom result (otherwise rendered by md())
    const MD_CHEATS = [
      { t: 'Заголовки', show: '# Заголовок 1\n## Заголовок 2\n### Заголовок 3', block: true },
